name: Mantis
faction: Vrell
layer: air
tier: medium
size: [80, 80]    # sprite px, facing inward from the left edge (mirrored on the right)
hitbox: [40, 56]
parts: single
orientation: fixed
hp: 26
armour: none
speed: 150        # px/s while entering and leaving
movement:
  hover: {seconds: 6, y: [120, 360], edge_x: 40, exit: back}  # y px from the top; edge_x: px from its entry edge; exit back: leaves through the edge it came from
attacks:
