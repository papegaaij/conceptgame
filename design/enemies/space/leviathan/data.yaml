# Leviathan stat block at medium: rendered into README.md. Schema: ../../../tech/architecture/README.md#data-file-schemas
# A multi-part set piece: its parts are hit boxes around its centre, in its own frame (facing down
# the screen: dx right, dy up towards its tail); a level's pass turns them with its heading.
name: Leviathan
faction: Vrell
layer: high-air
tier: huge
size: [300, 480]    # sprite px, facing down: 300 across the fins, 480 long
hitbox: [110, 400]  # the armoured body
parts: multi
part_list:  # offset [dx, dy] px from the centre, in its own frame
  - {name: blowhole, offset: [0, 60], hitbox: [40, 40], hp: 150, kind: vital, bounty: 35}
  - {name: vent 1, offset: [-34, 20], hitbox: [26, 26], hp: 40, kind: destroyable, bounty: 12, attack: vents}
  - {name: vent 2, offset: [34, 20], hitbox: [26, 26], hp: 40, kind: destroyable, bounty: 12, attack: vents}
  - {name: vent 3, offset: [-30, 110], hitbox: [26, 26], hp: 40, kind: destroyable, bounty: 12, attack: vents}
  - {name: vent 4, offset: [30, 110], hitbox: [26, 26], hp: 40, kind: destroyable, bounty: 12, attack: vents}
  - {name: left fin, offset: [-105, -10], hitbox: [80, 60], hp: 60, kind: destroyable, bounty: 9, attack: fins}
  - {name: right fin, offset: [105, -10], hitbox: [80, 60], hp: 60, kind: destroyable, bounty: 9, attack: fins}
  - {name: fluke, offset: [0, 205], hitbox: [120, 50], hp: 80, kind: destroyable, bounty: 12}
orientation: fixed
hp: 510             # the parts' sum
armour: 'body armoured (sparks); high-air pass: only `homing` and `beam` hit'
speed: 30           # px/s drift
movement: {}
attacks:
  - pattern: aimed
    name: vents
    bullet: medium
    interval: 2.2
    speed: 130
    first_shot_delay: 0.6   # the four vents fire staggered, this far apart
    notes:
      text: 'second pass: each turret vent fires an `{pattern}` violet orb ({speed} px/s, `{bullet}` = {damage}) every {interval} s, staggered'
  - pattern: fan
    name: fins
    bullet: small
    count: 5
    spread: 60
    interval: 4
    speed: 150
    notes:
      text: 'fins sweep a {count}-way `{pattern}` ({speed} px/s) every {interval} s; contact with the body `huge` = {contact_damage}'
formations:
  - {name: solo set piece}
weak_points:
  - {name: 'blowhole (violet glow; a regular enemy, so not lime)', multiplier: 2}
drops:
  - {pickup: large salvage, every: 1}
traits: [piercing, homing, forward]
bounty: 113         # the parts' sum: ≈ 15 % of L03's budget at its bounty scale
first_level: 3
difficulty:
  hard: {burst: 2}  # vents fire 2-orb bursts; clusters of 8 seeds are the level's
notes:
  parts: 'body (`armoured`), 3 tail segments + fluke (articulated; fluke `destroyable`), 2 pectoral fins (`destroyable`), 4 dorsal turret vents (`destroyable`), blowhole (`vital`)'
  orientation: '(per pass: the first on its diagonal course, the second facing down; tail and fluke sway)'
  hp: 'blowhole 150; turret vent 40 each; fin 60 each; fluke 80; total'
  layer: ' (first pass) → `air` (second pass)'
  speed: drift; turns 10°/s
  movement: 'first pass: crosses diagonally on `high-air` in ≈ 12 s; second pass: descends (scale and shadow shrink to the air layer over 2 s) and drifts across the upper half for up to 30 s, then leaves'
  attack_prefix: 'first pass: blowhole releases a whirl cluster of 6 Whirl Seeds every 3 s; '
  bounty: ' (turret vent 12 each, fin 9 each, fluke 12, blowhole 35); killing the blowhole first destroys the rest for the full 113'
  death: '`huge`: chained `medium` bursts along the body, ichor cloud, whale-song cry; drops a large salvage pickup'
  used_in: Earth orbit; returns in Act 7 (L46) as a variant specified with that act
  difficulty: 'hard: clusters of 8 seeds; vents fire 2-orb bursts'
