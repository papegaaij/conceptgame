# Allies: the specs the game reads, one entry per ally slug; README.md's tables are hand-written for
# now. Schema: ../tech/architecture/README.md#data-file-schemas
# The civilian crawler (Level 04), the evacuation shuttle (Level 10, M5 part D) and the naval convoy's
# cargo ship and escort frigate (Level 11, M5 part E); the other allies get theirs with the levels that
# use them.
civilian-crawler:
  name: Civilian crawler
  layer: ground
  size: [40, 72]          # sprite px: 40 wide, 72 long
  hitbox: [32, 64]        # axis-aligned at every heading
  hp: 60                  # at medium; the level sets the difficulty variants
  damaged_by:
    objective_aimed: true # only enemy shots aimed at a crawler by the target-the-objective hook
    claws: 10             # damage per second while a walker's hitbox overlaps it (pass-through)
  follows: road           # the level's road curve, at the scroll speed
  headings: {count: 7, step: 10}   # ±30° in 10° steps, rendered, not rotated
  smoke_below: 0.5        # share of its HP
evacuation-shuttle:       # Level 10 (M5 part D, user decisions D1, D2 and D4 of 2026-10-08)
  name: Evacuation shuttle
  layer: air
  size: [64, 40]          # sprite px: 64 wide, 40 long, nose up
  hitbox: [48, 28]
  hp: 120                 # armour at medium; the level sets the difficulty variants (180 / 90)
  damaged_by:             # user decision D2 = a of M5 part D
    objective_aimed: false
    claws: 0
    bullets: true         # every enemy bullet touching its hit box hurts it by its class and is spent
    contact: true         # an `air` enemy's body hurts it by the enemy's tier once per contact, a `tiny` or
                          # `small` one destroyed by the impact (and paid, as when it rams the ship)
  follows: lanes          # its station in the level's band with the lane sway, no road (D1 = a)
  headings: {count: 1, step: 10}   # always nose up; it banks instead
  banks: {frames: 5, full: 20}     # rendered banking frames, the full bank at 20 px/s of sideways speed (the lane sway peaks at 8-13 px/s)
  glide: 3                # s of the lost shuttle's glide into `far` (presentation)
  smoke_below: 0.5        # share of its HP
  first_level: 10         # its sprites go in Level 10's atlas until the level's data escorts it
cargo-ship:               # Level 11's convoy (M5 part E, user decision E8 = a and the stated defaults of 2026-10-08)
  name: Convoy cargo ship
  layer: ground           # naval surface
  size: [56, 120]         # sprite px: 56 wide, 120 long, bow up (fits one 120 px slam lane)
  hitbox: [48, 112]       # its stations and lanes; nothing on the player's plane touches it
  hp: 4                   # counts slams at medium: it survives three and sinks on the fourth (the level's easy: 5, hard: 2; tuned 2026-10-09 so an arm-first pilot keeps the convoy)
  damaged_by:
    objective_aimed: false
    claws: 0
    slams: 1              # the hits one boss slam in its lane deals; nothing else hurts it
  follows: stations       # its screen-space station at the scroll speed, its arena lane at the halt (a level's convoy block)
  headings: {count: 1, step: 10}   # always bow up
  smoke_below: 0.85       # share of its HP: it smokes and lists from its first hit (easy's 4 of 5 too)
  first_level: 11         # its sprites go in Level 11's atlas until the level's data sails it
escort-frigate:           # Level 11's CDFS Ruyter (M5 part E)
  name: Escort frigate
  layer: ground           # naval surface
  size: [40, 110]         # sprite px, bow up
  hitbox: [32, 102]
  hp: 1                   # never used: its damaged_by names nothing, so it cannot be damaged and is never lost
  damaged_by:
    objective_aimed: false
    claws: 0
  follows: stations       # leaves the arena off the bottom edge at the halt and returns after the boss (the level's leaves: true)
  headings: {count: 1, step: 10}
  smoke_below: 0.5
  flak: {every: 2.0}      # presentation: a burst on low-air over the convoy every 2 s while it is on its station, hitting nothing
  first_level: 11
