# Level 11 – Atlantic Convoy: the level script, rendered into README.md (briefing, threat profile,
# layout, waves, ground targets, radio, credit budget). Times are seconds from the level start; the
# level clock halts at the arena's end (t = 161) while the Harbour Kraken lives, so everything in the
# fight runs on the simulation's real steps and the arena's radio lines are events (M5 part E).
# Schema: ../../../tech/architecture/README.md#data-file-schemas
# The `backdrop` block and the sections' tiles are merged in from the round 33 backdrop proposal
# (concept/backdrop-proposal.yaml, tools/art/backdrop_l11.py --proposal, which reads this file).
scroll_speed: 140     # the chosen ocean scene's slower swell
launch_seconds: 5     # flying in from the bottom edge with Rook in his slot, as in Levels 08-10
bounty_scale: 0.6     # every bounty × 0.6: the typical haul on budget(11) (M5 part E, step E3a)
water: true           # E1 = a: the whole play field is water (the torpedo runs; kills and landing blasts splash)
control_prompts: []
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: Earth ocean
  layers: [ground, sub, air]
  density: 3
  traits: [spread, anti-ground]   # `anti-sub` is optional (the notes): three traits do not fit the intel panel
  hazards: [drifting organisms]
  boss: Harbour Kraken
  objective: CONVOY TO OPEN WATER   # the OBJECTIVE field from sensor L1
  varga:
    none: Open Atlantic, Lancer. Something rides the current out there, on the water and under it.
    l1: "Mostly from ahead. Drifting organisms on the sea lanes: don't loiter over them."
    l2: "New: Driftjellies and Reef Spitters. And something huge."
    l3: Anti-ground for rafts. Torpedoes for the sunken cache.
  notes:
    Dominant layers: '`ground` (naval surface: rafts, surfaced jellies, the Kraken''s arms and head when up), `sub` (submerged jellies, the Kraken below, a sunken pod), `air`'
    Attack directions: '{directions}'
    Density: '{density}'
    Recommended traits: '`spread`, `anti-ground`; `anti-sub` optional (submerged jellies, the sunken pod, the Kraken''s head in phase 1), not `required`'
    Hazards: Driftjelly fields (proximity rings on and under the surface)
    Boss / mid-boss: 'Mid-boss [Harbour Kraken](../../../enemies/bosses/harbour-kraken/README.md)'
    Sensor-suite detail: 'none: open ocean, `ground` + `sub` + `air`, front · L1: + directions, density {density}, hazard "drifting organisms", the objective `{objective}` · L2: + Driftjelly (new), Reef Spitter (new), Needler, Stinger, Skitter and Mote Swarm portraits; the mid-boss silhouette "unknown, large, submerged" · L3: + `spread` and `anti-ground` highlighted (`anti-sub` marked optional), the wave strip marking the mid-boss at ≈ 160 s, 1 secret'

sections:  # back to back from t = 0; tiles: the backdrop's tile sets (tools/art/backdrop_l11.py --proposal); peak: a heavier atmosphere inside the section
  - name: Convoy Muster
    end: 20
    atmosphere: light
    tiles: [swell, chop]
    notes:
      layers:
        deep: slate swell with a slow colour field.
        ground: the convoy at its stations, wakes and prop-wash.
        low-air: sea-mist banks (~15%).
        high-air: thin wisps.
      purpose: Meet the convoy; the first popcorn from t=7.
  - name: Jelly Fields
    end: 65
    atmosphere: light
    tiles: [swell, chop]
    notes:
      layers:
        ground: Driftjelly fields drifting in the current, surfaced jellies cut at the waterline; Vrell spawn slicks.
        sub: submerged jellies under the tint pass; at t≈55 a huge dark shape (≈ 400 px) slides under the convoy and fades into the deep (the Kraken, foreshadowing, scenery).
      purpose: Driftjellies introduced alone first; the `sub` layer seen.
  - name: Reef Line
    end: 110
    atmosphere: medium
    tiles: [swell, chop]
    notes:
      layers:
        ground: violet-veined Vrell reef growths breaking the surface in lines, with foam collars; Reef Spitter rafts bobbing on kelp.
        sub: reef roots fading into the deep, a CDF supply pod snagged on one (the secret).
        low-air: mist banks (~22%).
      purpose: Reef Spitters introduced as a lone nest of 3, then combined with a jelly field.
  - name: Tiamat Approach
    end: 160
    atmosphere: light
    tiles: [swell, chop]
    notes:
      layers:
        ground: debris and floating cargo containers from a burning freighter (smoke at half particle speed, per the motion budget); the overrun fusion platform Tiamat enters at the top at the end, gripped by the Kraken's armoured arms.
        sub: the Kraken's mantle shadow under the platform.
      purpose: Mixed waves; the last Reef Spitter nest; the flotsam pickups.
  - name: Harbour Kraken
    end: 161   # the scroll eases to a halt over the arena's first second (68.8 px); the level clock halts here while the Kraken lives
    speed: 0
    arena: true
    atmosphere: clear
    tiles: [swell, chop]
    notes:
      layers:
        ground: platform Tiamat at the top of the play field, four lanes of 120 px below it, the three cargo ships in lanes 1, 2 and 4 in the lower band.
        sub: the Kraken's mantle, head and idle arms under the surface.
      purpose: The mid-boss (≈ 60 s at medium); the scroll stays halted while it lives, and section 6 starts at its death.
  - name: Open Water
    end: 176
    atmosphere: clear
    peak: {atmosphere: light, from: 170, to: 176}   # a lighter overcast giving way to haze at the end
    tiles: [swell, chop]
    notes:
      layers:
        ground: the convoy steaming north past the abandoned platform.
        deep: the swell under a lighter overcast.
      purpose: Release; level end.

boss:  # the mid-boss: anchored to Platform Tiamat, it scrolls in with the platform and engages at the halt
  enemy: harbour-kraken
  t: 160
  x: 240
  section: 5
  notes:
    from: front (anchored to Platform Tiamat, scrolls in with it)
    waves: 'At the halt (the bar, the sting, the boss checkpoint); releases a Driftjelly field of 6 in lanes 1 and 4 at its first surfacing'

# Act 2 popcorn (Skitter streams and snakes, Needler lines, small Mote Swarms) round the set pieces, a
# wave every 2.5-3.5 s (the act's minimum: at least 50 a minute; the pacing rule: no empty screen over
# 3 s). No rear waves (front 90 / sides 10, default). The two introductions keep a quiet window: no
# other wave enters for 3 s after the first jelly field (t=22) or the first raft nest (t=70). A `field`
# wave's x and size give its area (its bottom edge enters at the top edge at t), scrolling with the sea
# and drifting along its current (° from straight down). Swarm routes: [x, y] points of the leader
# point, y px below the top edge, starting outside the play field.
