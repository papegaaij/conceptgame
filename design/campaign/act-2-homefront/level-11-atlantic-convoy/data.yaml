ground_targets:  # at: [t, x], when it enters at the top edge and its x; containers keep to the gaps between the convoy's hulls (hulls at x 130, 240, 350, 56 px wide); a raft's 84 px base does not fit a 54 px gap, so the rafts keep to the flanks (x <= 58 or >= 430, drift included)
  - target: lone raft nest
    section: 3
    enemy: reef-spitter
    count: 3
    at: [[70, 50], [70.6, 430], [71.2, 46]]   # on the first reef line's kelp, both flanks
    notes:
      target: '**New.** A lone [Reef Spitter](../../../enemies/naval/reef-spitter/README.md) nest ×{count} (t≈70): no other wave enters until t=73'
      effect: Bounty {bounty} each; the raft sinks when the gun dies
  - target: reef raft nest
    section: 3
    enemy: reef-spitter
    count: 4
    current: 15
    at: [[100.5, 50], [101.1, 46], [101.7, 50], [102.3, 46]]   # a column on the left flank, after the sunken pod has passed: nothing on the water draws a torpedo off it
    notes:
      target: Reef Spitter nest ×{count} (t≈101), drifting to the right
      effect: With the t=100 jelly field
  - target: sunken pod
    section: 3
    layer: sub
    size: [32, 24]
    sprite: sunken-pod   # tools/art/l11_props.py: the pod on the reef root, sunken-pod-rise as it floats up
    # round 33 (user): 3 hits (hard 5), so one L1 Torpedo Pod lined up frees it (4 needed a timed first shot)
    hits: 3
    hard: {hits: 5}
    reveals: sunken pod
    at: [[93.78, 296]]   # on the reef root of the t=96 reef line (its centre passes the middle of the screen at t≈95.8)
    notes:
      target: Snagged CDF supply pod on a reef root (`sub` trigger, t≈94)
      effect: '{hits} torpedo hits (hard 5) or a Smart Bomb free it; floats up as the hidden crate'
  - target: floating containers
    section: 4
    layer: ground
    size: [32, 24]
    sprite: floating-container   # tools/art/l11_props.py: on the water with its foam collar
    hp: 3
    drop: small salvage
    group: containers   # the last one destroyed drops the armour patch (pickups)
    count: 8
    at: [[112.5, 60], [114.5, 185], [117, 420], [119.5, 296], [122.5, 50], [125, 185], [131.5, 296], [134.5, 60]]
    notes:
      target: Floating cargo containers ×{count} from the burning freighter (`ground`, {hp} HP, t≈112–135)
      effect: Each drops a {drop} pickup ({drop_credits}); the last one destroyed drops an armour patch
      budget: floating containers {count} × {drop} {drop_credits}
  - target: freighter raft nest
    section: 4
    enemy: reef-spitter
    count: 5
    current: -15
    at: [[128, 54], [128.65, 58], [129.3, 54], [129.95, 58], [130.6, 54]]   # a column on the left flank, across from the freighter's smoke on the right edge
    notes:
      target: Reef Spitter nest ×{count} across from the burning freighter (t≈128), drifting to the left
      effect: Bounty
  - target: hard raft nest
    section: 4
    enemy: reef-spitter
    count: 0
    at: []
    hard: {at: [[140.5, 50], [141, 430], [141.7, 46]]}
    notes:
      target: Reef Spitter nest among the flotsam (t≈140), **hard only**
      effect: Bounty

secrets:
  - name: sunken pod
    crate: 100   # Act 1 terms: pays 160 with the act factor
    radio: {speaker: Varga, line: "A CDF supply pod. Good fishing, Lancer."}

pickups:
  - {pickup: overdrive, dropped_by: {wave: 84, unit: first}}            # the leader of the t=84 Stinger V-wing
  - {pickup: armour patch, dropped_by: {group: containers, unit: last}}   # the last floating container destroyed

radio:  # trigger: t or event; requires: escort = only while Rook flies (hired, fitted and not ejected); the arena's lines are events (the level clock is halted)
  - {t: 1, speaker: Atlas Control, portrait: generic-cdf, line: "Aegis flight, Atlas-Seven. Three hulls of reactor parts for the Arctic grid. We'd like to arrive with all three."}
  - {t: 14, speaker: Rook, requires: escort, line: "Long way to swim, Atlas. We'll keep you dry."}
  - {t: 21.5, speaker: Varga, line: "Those jellies drift with the current. Don't hover over them: they pulse when you're close."}
  - {t: 34, speaker: Varga, line: "Some are under the surface, and they still pulse. Our guns can't reach them there. Torpedoes can."}
  - {t: 55, speaker: Rook, requires: escort, line: "Lancer... did the sea just move under the convoy?"}
  - {t: 62.5, speaker: Atlas Control, portrait: generic-cdf, line: "Sonar has a contact. Big. Very big. It's gone deep again."}
  - {t: 70.5, speaker: Varga, line: "Gun rafts on the reef. Barnacle guns. Anti-ground rounds crack them twice as fast."}
  - {t: 110, speaker: Atlas Control, portrait: generic-cdf, line: "Platform Tiamat has been silent for six hours. Our route runs right past it."}
  - {t: 140, speaker: The Choir, distorted: true, line: "[the Choir sings]"}
  - {t: 146.5, speaker: Varga, line: "The contact is rising under the platform. Lancer, it's holding on to it."}
  - {t: 158, speaker: Rook, requires: escort, line: "Here comes the big one."}
  - {event: first-telegraph, speaker: Okafor, line: "Watch the churning water. That's where the arms come down.", notes: {trigger: "First lane telegraph (`first-telegraph`)"}}
  - {event: boss-part-destroyed, parts: [left arm, right arm], speaker: Rook, requires: escort, line: "Tell the cook we're having calamari.", notes: {trigger: "First slam arm severed (`boss-part-destroyed`, the slam arms)"}}
  - {event: ally-hit, speaker: Atlas Control, portrait: generic-cdf, line: "The {ally} is hit! Taking on water, but holding!", notes: {trigger: "A cargo ship's first hit (`ally-hit`)"}}
  - {event: ally-lost, speaker: Atlas Control, portrait: generic-cdf, line: "We've lost the {ally}. Crew in the water. Ruyter is picking them up.", notes: {trigger: "A cargo ship sinks (`ally-lost`)"}}
  - {event: boss-destroyed, speaker: Varga, line: "It's letting go of the platform. It's sinking. Good.", notes: {trigger: "Kraken destroyed (`boss-destroyed`)"}}
  - {event: secondary-objective, speaker: Atlas Control, portrait: generic-cdf, line: "All three hulls afloat. Drinks are on Atlas, Aegis."}
  - {event: level-end, allies: [1, 3], speaker: Okafor, line: "Atlas-Seven is through. The Arctic grid gets its parts. Good work, Aegis.", notes: {trigger: "Level end, 1–3 ships afloat"}}
  - {event: level-end, allies: [0, 0], speaker: Okafor, expression: grim, line: "We lost Atlas-Seven, but the sea lane is open. Come home, Lancer.", notes: {trigger: "Level end, no ship afloat"}}

objectives:
  primary: reach-end   # the convoy never fails the mission (no mission-failed line)
  secondary: {afloat: true, label: CONVOY, credits: 100}   # E8 = a, "Convoy afloat": all three cargo ships afloat at the Kraken's death (100 in Act 1 terms: pays 160)

convoy:  # a naval convoy outside the objectives (design/allies): stations px from the left / below the top edge, held at the scroll speed
  units:
    - {ally: cargo-ship, name: Halvorsen, station: [130, 380], lane: 1}
    - {ally: cargo-ship, name: Mbeki, station: [240, 350], lane: 2, hold: [180, 620]}   # drops back off the bottom edge after the Kraken while Tiamat's deck (x 136-344) passes over lane 2
    - {ally: cargo-ship, name: Saint-Laurent, station: [350, 380], lane: 4}
    - {ally: escort-frigate, name: Ruyter, station: [240, 480], leaves: true}   # CDFS Ruyter drops back off the bottom edge at the halt and returns after the Kraken
  glide: 3       # s to the lanes at the halt and back to the stations after the Kraken, on the real steps
  lane_y: 450    # a cargo ship's centre in its lane, in the lower band (y 390-510)
  hold_clear: 552   # px the sea scrolls after the Kraken before the units glide back to their stations: Platform Tiamat's deck (its top edge 538 px above the bottom edge at the halt, round 33) has passed the bottom edge; meanwhile each holds in its lane (lanes 1 and 4 lie clear of the deck), away or at its hold point
  easy: {hp: 5}  # easy: a cargo ship survives three slams and sinks on the fourth
  hard: {hp: 2}  # hard: it survives one and sinks on the second

music:
  track: 7            # Act 2 B "Firestorm" (audio/music track list)
  start_section: 2    # the base stem from the Jelly Fields; section 1 has the ocean ambience only
  full_section: 4     # the full mix from the Tiamat approach
  ambience: earth-ocean
  end_jingle: mission-complete
  boss_sting: miniboss-sting   # track 21 at the arena halt, when the boss bar appears, then the track again

difficulty: {}  # the jelly fields' easy sizes and the hard raft nest are in their entries; the sunken pod's hard hits in its own; the convoy's easy HP in `convoy`; the stat blocks' hooks apply (hard: 12-bullet rings within 110 px, 5-way raft fans; the Kraken's 0.8 s telegraph and three lanes)

briefing:
  pages:
    - {speaker: Okafor, image: level-11-convoy-route, line: "The Arctic relays are running on reserve power, Lancer. Convoy Atlas-Seven carries their reactor parts across the Atlantic: three cargo hulls and a frigate. Something large has been tracked near Platform Tiamat, right on their route. Get them to open water."}
    - {speaker: Varga, image: level-11-sub-scan, line: "The Vrell have seeded the sea lanes. Jellies drift on the surface and below it, and gun rafts grow on the reefs. Our guns can't touch what's under the waves. Torpedo pods can, if you buy them."}
  teaser: {speaker: Rook, line: "Cargo ships to mind and jellyfish that shoot back. Torpedo pods are in the shop, if you fancy fishing."}

backdrop:
  # Presentation only: the grey North Atlantic of convoy Atlas-Seven (tools/art/backdrop_l11.py, straight
  # from scene-ocean-r10-a, E9 = a). The sea is two layers: the long swell on `deep` (0.85, opaque) and the
  # short chop on `ground` (1.0, translucent), so the swell slides under the chop while the sea streams by.
  scroll_factors: {deep: 0.85, far: 0.9, ground: 1.0, low-air: 1.3, high-air: 2.0}
  ramp: 4
  haze_colour: 70808a  # the overcast's grey light on the water (over the swell only)
  atmosphere:
    clear: {wisps: wisps, haze: 0.08}   # the arena and open water: a lighter overcast on the swell
    light: {banks: sea-mist, wisps: wisps, haze: 0.03}   # sea mist ~15 %, thin wisps
    medium: {banks: mist-banks, wisps: wisps, haze: 0.06}   # section 3: mist banks ~22 % between the reefs
  tile_sets:
    swell: {layer: deep, height: 960}   # the long Atlantic swell and its slow tone field (opaque), every section; the chop slides over it (deep at 0.85)
