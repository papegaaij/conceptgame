    - {piece: spawn-slick-a, t: 51, x: 196}
    - {piece: spawn-slick-b, t: 58, x: 380}
    # 3. Reef Line: seven lines, 7 s apart (one on screen at a time, at most two growth ids each); growths only outside the convoy's channels (x 102-158, 212-268, 322-378)
