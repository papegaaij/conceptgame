# Level 11 backdrop PROPOSAL (tools/art/backdrop_l11.py --proposal; M5 part E batch, round 33).
# For the level-data step to merge into data.yaml: `backdrop` is the level's block, and every section
# takes the `tiles` below (the sea is the same two tile sets throughout: no seams).
#
# sections[i].tiles (by section, in order):
#   Convoy Muster: [swell, chop]
#   Jelly Fields: [swell, chop]
#   Reef Line: [swell, chop]
#   Tiamat Approach: [swell, chop]
#   Harbour Kraken: [swell, chop]
#   Open Water: [swell, chop]
#
# Built round this timeline (re-run --proposal and the images after the data moves a section end):
#   Convoy Muster to 20, Jelly Fields to 65, Reef Line to 110, Tiamat Approach to 160, Harbour Kraken to 161 (speed 0, arena), Open Water to 176; 140 px/s.
# Platform Tiamat (piece platform-tiamat, 256 x 208, centred on the platform's centre; deck 208 x 152,
#   edges x +-104, y +-76, round 07's model): its centre lies 22,931 px up the ground layer (from the
#   screen's bottom at the level start), x 240. At the halt (ground scroll 22,468.83 = scrollAt(t 160)
#   + the ease into the halt, 68.83 px: Sortie.haltScroll)
#   that is screen (240, 78) from the play field's top left: the deck spans x 136-344,
#   y 2-154; the lanes run below y 154; the Kraken's head centre (216 px below, off the
#   deck's south edge) is at (240, 294).
#   It scrolls in at the top over the last 1.3 s before the halt; at the halt the piece's top edge
#   is -26 px below the top. The Kraken's anchor uses the same ground position
#   (the halt scroll + 462). The placement t lies in the open-water section, by the data's scrollAt (speed 0
#   in the arena): end(arena) + (ground position - 270 - scrollAt(arena start)) / its speed.
# The convoy's channels: no piece that breaks the surface lies under a station's hull (x 130, 240,
#   350 +- 28 px, the README's stations); slicks, oil and the reef shelves lie flat or under water.
# After the halt the platform (x 136-344) scrolls down through Mbeki's and Ruyter's stations (x 240)
#   in about 3.9 s: the convoy's return to its stations (step E2b) should wait until it has passed.
# Motion budget (BackdropCheck, at most 2 animated ids on screen): the reef growths (one line on screen
#   at a time, at most two ids a line), the freighter and its smoke (section 4), the platform's foam;
#   no tile set drifts. The sea moves by its parallax (deep 0.85 under the ground's chop).

backdrop:
  # Presentation only: the grey North Atlantic of convoy Atlas-Seven (tools/art/backdrop_l11.py, straight
  # from scene-ocean-r10-a, E9 = a). The sea is two layers: the long swell on `deep` (0.85, opaque) and the
  # short chop on `ground` (1.0, translucent), so the swell slides under the chop while the sea streams by.
  scroll_factors: {deep: 0.85, far: 0.9, ground: 1.0, low-air: 1.3, high-air: 2.0}
  ramp: 4
  haze_colour: 70808a  # the overcast's grey light on the water (over the swell only)
  atmosphere:
    clear: {wisps: wisps, haze: 0.08}   # the arena and open water: a lighter overcast on the swell
    light: {banks: sea-mist, wisps: wisps, haze: 0.03}   # sea mist ~15 %, thin wisps
    medium: {banks: mist-banks, wisps: wisps, haze: 0.06}   # section 3: mist banks ~22 % between the reefs
  tile_sets:
    swell: {layer: deep, height: 960}   # the long Atlantic swell and its slow tone field (opaque), every section; the chop slides over it (deep at 0.85)
    chop: {layer: ground, height: 960}   # the short chop and sparse whitecaps (translucent, alpha >= 3 everywhere: the shadow stencil), every section
    sea-mist: {layer: low-air, height: 960}   # light: thin sea-mist banks, ~15 % cover, still on their layer
    mist-banks: {layer: low-air, height: 960}   # medium: mist banks between the reefs, ~22 % cover
    wisps: {layer: high-air, height: 960}   # thin high wisps (additive, under 16 % alpha)
  pieces:
    spawn-slick-a: {layer: ground, size: [168, 112]}   # a Vrell spawn slick: olive film and spawn beads (section 2)
    spawn-slick-b: {layer: ground, size: [128, 168]}
    reef-shelf-a: {layer: ground, size: [480, 128]}   # a reef line's mass under the surface, seen through the water
    reef-shelf-b: {layer: ground, size: [480, 112]}
    reef-growth-a: {layer: ground, size: [48, 40], frames: 4, fps: 5}   # tools/art/l11_props.py: Vrell reef growths breaking the surface, collar loops
    reef-growth-b: {layer: ground, size: [64, 48], frames: 4, fps: 5}
    reef-growth-c: {layer: ground, size: [40, 56], frames: 4, fps: 5}
    reef-root-a: {layer: ground, size: [64, 48]}   # l11_props.py's root fading into the deep, drawn through the water here
    oil-slick: {layer: ground, size: [224, 160]}   # the freighter's oil: a dark film with a faint sheen (section 4)
    flotsam-a: {layer: ground, size: [56, 44]}   # planks, a barrel and a life ring afloat
    flotsam-b: {layer: ground, size: [52, 48]}   # crates, planks and a fender afloat
    lifeboat: {layer: ground, size: [32, 64]}   # a capsized orange lifeboat
    burning-freighter: {layer: ground, size: [72, 136], frames: 4, fps: 8, mid_size: true}   # l11_props.py: the abandoned freighter, listing, its deck fires flickering
    freighter-smoke: {layer: ground, size: [88, 232], frames: 8, fps: 6}   # its smoke column trailing down the right edge, billowing in place (no travel)
    platform-tiamat: {layer: ground, size: [256, 208], frames: 4, fps: 5, mid_size: true}   # Platform Tiamat: round 07's deck (208 x 152) at its centre, its shadow, foam lapping at its edges
  placed:
    # 2. Jelly Fields: Vrell spawn slicks (flat on the surface, the convoy steams over them)
    - {piece: spawn-slick-a, t: 26, x: 70}
