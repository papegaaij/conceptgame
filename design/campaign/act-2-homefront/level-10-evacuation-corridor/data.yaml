# Level 10 – Evacuation Corridor: the level script, rendered into README.md (briefing, threat
# profile, layout, waves, ground targets, radio, credit budget). Times are seconds from the level
# start; L10 has no hold zones, so script time is real time (the scroll distance ÷ 190 px/s).
# Schema: ../../../tech/architecture/README.md#data-file-schemas
# The `backdrop` block and the sections' tiles are merged in from the round 32 backdrop proposal
# (concept/backdrop-proposal.yaml, tools/art/backdrop_l10.py --proposal, which reads this file).
scroll_speed: 190     # a chase level, the fastest scroll so far
launch_seconds: 5     # flying in from the bottom edge with Rook in his slot, as in Levels 08 and 09
bounty_scale: 0.56    # every bounty × 0.56: the typical haul on budget(10) (M5 part D, step D5)
crate_seconds: 12     # the ferry cache's crate stays 12 s, not 6: at 40 px/s it drifts from the top edge to the ship's start line (2026-10-08)
control_prompts: []
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: Earth megacity
  layers: [air, high-air]
  density: 3
  traits: [rear, spread]
  required: [rear]   # D9 = a: the launch warning at every sensor level without a rear-slot weapon
  hazards: []
  boss: none
  objective: ESCORT 5 SHUTTLES   # the OBJECTIVE field from sensor L1
  varga:
    none: Nova Lagos's outskirts at first light, Lancer. Flyers only, and five shuttles to keep alive.
    l1: "A third of it comes from behind you, Lancer. Five shuttles in one corridor: keep them flying."
    l2: "New: the Wraith, cloaked until it strikes from behind, and the Mote Swarm, a flock that turns back."
    l3: "A rear gun is a must: only homing finds a cloaked Wraith. One cache: a capsized ferry's hatch. Shoot it open."
  notes:
    Dominant layers: '`air`, `high-air` (cloaked Wraiths); `low-air` carries smoke, sea mist and CDF helicopters (scenery)'
    Attack directions: '{directions} by enemy count; **by threat** about a third from behind (the looping Mote Swarms come back from the bottom edge, and the Wraiths strike from it)'
    Density: '{density}'
    Recommended traits: '`rear` (**required**, user decision D9 = a), `spread` (`homing` also reaches a cloaked Wraith on its pass overhead)'
    Hazards: none (enemy fire crossing the shuttle band hurts the shuttles)
    Boss / mid-boss: 'none (finale: a Wraith ambush as the shuttles climb)'
    Sensor-suite detail: 'none: Earth megacity at first light, `air` + `high-air`, front and rear · L1: + directions, density {density}, the objective `{objective}` · L2: + Wraith (new), Mote Swarm (new), Skitter, Needler and Stinger portraits; no boss · L3: + `rear` and `spread` highlighted, the wave strip marking the five Wraith ambushes (50, 79, 106, 157 and 187.5 s), 1 secret'

sections:  # back to back from t = 0; tiles: the backdrop's tile sets (tools/art/backdrop_l10.py --proposal); peak: a heavier atmosphere inside the section
  - name: Liftoff
    end: 20
    atmosphere: light
    tiles: [morning-sky, spaceport]
    notes:
      layers:
        deep: the sprawl at dawn, a pale sky in the east.
        ground: Eko spaceport, its pads, blast fences and service vehicles.
        low-air: smoke from the city behind.
      purpose: The liftoff (the five shuttles rise off their pads, t 1–7); Skitters and Needlers over the pads from t≈8.
  - name: Refugee Roads
    end: 70
    atmosphere: clear
    tiles: [morning-sky, suburbs]
    notes:
      layers:
        ground: suburbs, highways jammed with stalled traffic and refugee columns (lights only, no figures at this scale), parks and football pitches.
        low-air: CDF helicopters heading the other way.
      purpose: Mote Swarm and Wraith introductions, each in a safe situation first; the first rear waves.
  - name: The Corridor
    end: 130
    atmosphere: medium
    tiles: [morning-sky, viaduct]
    notes:
      layers:
        ground: a maglev viaduct between two infested districts, creep on both sides.
        low-air: smoke columns.
        deep: the cloud deck. The loss's glow (the lander) pulses over Lifeline Three at t 116–118, drawn under the air layer.
        high-air: smoke wisps (≤ 40 %).
      purpose: Rear pressure builds; the scripted loss at t=118.
  - name: Coast Road
    end: 175
    atmosphere: light
    peak: {atmosphere: medium, from: 160, to: 175}   # the sea mist rolling in
    tiles: [morning-sky, coast]
    notes:
      layers:
        ground: the lagoon shore and the coast road, fishing piers, sandbars, the capsized ferry with its blinking hatch.
        low-air: sea-mist banks rolling in from the right.
      purpose: Mixed front and rear waves, the crossing swarms; the ferry secret.
  - name: Orbital Corridor
    end: 200
    atmosphere: clear
    tiles: [morning-sky, open-lagoon]
    notes:
      layers:
        deep: the open lagoon and the sea under the morning sky.
        ground: shallow water, buoys.
      purpose: The shuttles' engines flare and they climb off the top of the screen (t 196–198); the finale (a Wraith ambush) and the release.

# Act 2 popcorn (Skitter streams and snakes, Needler lines, small Mote Swarms, rear Skitter lines)
# round the set pieces, a wave every 2.5-3 s (the act's minimum: at least 50 a minute; the pacing
# rule: no empty screen over 3 s). Swarm routes: [x, y] points of the leader point, y px below the
# top edge, starting outside the play field; they keep to the side lanes (x <= 60 or >= 420) where
# they cross the shuttle band (y 140-300) and sweep across below it, so a loop-back climbs a side
# lane past the ship (straight up from the bottom edge at the route's end x). The Skitter snakes and
# streams keep out of the band as well (2026-10-08, the capture's rammed shuttles): a snake comes down
# the side lane of its edge (x 50 or 430) to y 250, curls across below the band (y 340-400) and leaves
# at the bottom of the other side; a stream unit from the left comes down x = 70 to y 300 and then
# runs diagonally to the bottom right (330, 580), one from the right the mirror image. Rear ambushes: lanes
# x = (i + 1) × 480 ÷ (n + 1), the warning 3 s ahead of the re-entry (about 4.6 s after t).
waves:
  - {t: 7.5, formation: stream, enemy: skitter, count: 4, from: front, edge: right, interval: 1.25, paths: [[[70, -40], [70, 300], [330, 580]]], notes: Over the pads as the shuttles climb; the first targets}
  - {t: 10.5, formation: snake, enemy: skitter, count: 6, from: front, edge: left, paths: [[[50, -40], [50, 250], [90, 340], [200, 380], [330, 400], [400, 470], [390, 580]]], notes: Curls over the blast fences}
