ground_targets:  # at: [t, x], when it enters at the top edge and its x (the ferry piece of the backdrop is placed round it)
  - target: ferry hatch
    section: 4
    layer: ground
    size: [36, 32]
    sprite: ferry-hatch   # assets/sprites/ferry-hatch_0..2, -break_0..7 (tools/art/backdrop_l10.py --props)
    hp: 50   # 2026-10-08: 8 → 50, about a second of the plan's forward guns lined up on it (fix of the capture's hatch opened at the top edge)
    reveals: ferry cache
    at: [[150, 322]]   # on the capsized ferry's hull, on its sandbar
    notes:
      target: "The capsized ferry's hull hatch on a sandbar, blinking: a destructible of {hp} HP (about a second of the forward guns lined up on it, so a passing sweep does not open it at the top edge), no bounty (t≈150)"
      effect: Releases the hidden crate (secret, see below)

secrets:
  - name: ferry cache
    crate: 100   # Act 1 terms: pays 160 with the act factor
    radio: {speaker: Varga, line: "That ferry's hold had a CDF supply crate in it. Take it, Lancer."}

pickups:  # carried by Needlers high on the screen, where the drop can still be caught (a Wraith dies near the bottom edge)
  - {pickup: overdrive, dropped_by: {wave: 111.5, unit: last}}      # the last Needler of the V-wing after the t≈106 ambush
  - {pickup: armour patch, dropped_by: {wave: 154.5, unit: last}}   # the last Needler of the V-wing before the t≈157 ambush

radio:  # trigger: t or event; requires: escort = only while Rook flies (hired, fitted and not ejected)
  - {t: 1, speaker: Lifeline One, portrait: generic-civilian, line: "Eko Control, Lifeline One. Five birds, eleven hundred souls. We're going."}
  - {t: 12, speaker: Okafor, line: "Lifeline flight, Aegis has you. Stay in the corridor and stay together."}
  - {t: 24, speaker: Rook, requires: escort, line: "Something's coming down the left. A lot of somethings."}
  - {t: 32, speaker: Varga, line: "That's a flock, not a formation. They steer like starlings."}
  - {event: first-decloak, speaker: Varga, line: "It hid in plain sight! Cloaked, only homing touches it. Rear guns!", notes: {trigger: "First decloak (`first-decloak`)"}}
  - {event: first-loop-back, speaker: Rook, requires: escort, line: "The flock's turned around. They're coming up behind us!", notes: {trigger: "First loop-back (`first-loop-back`)"}}
  - {event: first-ally-hit, speaker: Lifeline, portrait: generic-civilian, line: "Lifeline {ally}, we're hit! Still flying. Please stay close!", notes: {trigger: "First shuttle hit (`first-ally-hit`)"}}
  - {t: 116, speaker: Lifeline Three, portrait: generic-civilian, line: "Aegis, there's a light above the clouds. What is that—"}
  - {event: scripted-loss, speaker: Okafor, expression: grim, line: "Lifeline Three is down. Keep the others moving, Lancer.", notes: {trigger: "Scripted loss (`scripted-loss`)"}}
  - {t: 131.5, speaker: Rook, requires: escort, line: "Where did that come from? Nothing on my scope!"}
  - {t: 139, speaker: Varga, line: "That shot came from above the cloud deck. Something big is sitting up there, out of reach."}
  - {event: ally-lost, speaker: Okafor, expression: grim, line: "We lost Lifeline {ally}. Stay on the others.", notes: {trigger: "A shuttle is lost (`ally-lost`)"}}
  - {t: 180, speaker: The Choir, distorted: true, line: "[the Choir sings]"}
  - {t: 188.5, speaker: Rook, requires: escort, line: "Last one out of Lagos, get the lights."}
  - {t: 196, speaker: Lifeline One, portrait: generic-civilian, line: "Corridor clear. We can see the sky. Thank you, Aegis. Thank you."}
  - {event: level-end, allies: [4, 4], speaker: Okafor, line: "Four of five made orbit. Eight hundred and eighty people will see tomorrow. Remember the ones you got home.", notes: {trigger: "Level end, 4 shuttles home"}}
  - {event: level-end, allies: [3, 3], speaker: Okafor, line: "Three shuttles made orbit. Six hundred and sixty people will see tomorrow. Good work, Lancer.", notes: {trigger: "Level end, 3 shuttles home"}}
  - {event: level-end, allies: [2, 2], speaker: Okafor, line: "Two shuttles made orbit. Four hundred and forty people will see tomorrow. It's not nothing, Lancer.", notes: {trigger: "Level end, 2 shuttles home"}}
  - {event: level-end, allies: [1, 1], speaker: Okafor, line: "One shuttle made orbit. Two hundred and twenty people will see tomorrow. Hold on to that.", notes: {trigger: "Level end, 1 shuttle home"}}
  - {event: mission-failed, speaker: Okafor, expression: grim, line: "We've lost the corridor, Lancer. Pull back.", notes: {trigger: "The four saveable shuttles lost (the failed screen's line)"}}

objectives:
  primary: escort   # D5 = a: no secondary; the mission fails at once when the four saveable shuttles are lost
  escort:
    ally: evacuation-shuttle
    credits: 25   # per saveable shuttle home (Act 1 terms: pays 40); not Lifeline Three's
    stations:     # D1 = a: a loose double column in the band y 140-300, Lifeline One leading; the lane sway (x + 16 sin θ, y + 4 sin 2θ)
      - {at: [240, 165], sway: [16, 4], period: 9, phase: 0}       # Lifeline One
      - {at: [168, 215], sway: [16, 4], period: 11, phase: 0.25}   # Lifeline Two
      - {at: [312, 215], sway: [16, 4], period: 10, phase: 0.5}    # Lifeline Three
      - {at: [168, 270], sway: [16, 4], period: 12, phase: 0.75}   # Lifeline Four
      - {at: [312, 270], sway: [16, 4], period: 8, phase: 0.1}     # Lifeline Five
    liftoff: {t: 1, seconds: 6, pads: [[240, 400], [176, 440], [304, 440], [176, 490], [304, 490]]}   # untouchable, pad to station
    climb: {t: 196, seconds: 2}   # untouchable; every saveable shuttle alive at t=196 is home
    scripted_loss: {unit: 3, t: 118, glow: 2}   # D4 = a: Lifeline Three, untouchable until the lance
    easy: {hp: 180}
    hard: {hp: 90}

music:
  track: 6            # Act 2 A "Homefront" (audio/music track list)
  start_section: 2    # the base stem from the Refugee Roads; section 1 has the ambience only
  full_section: 3     # the full mix from the Corridor (t=70)
  ambience: earth-megacity
  end_jingle: mission-complete
  duck: {on: scripted-loss, db: -6, seconds: 3}   # the lance: −6 dB for 3 s, no sting
  ambience_changes:
    - {section: 4, ambience: earth-ocean, crossfade: 4}   # the coast road: the ocean over 4 s

difficulty: {}  # the swarms' loops, the ambushes' sizes and the hard pair at t=170 are in their waves; the shuttles' armour in the escort; the stat blocks' hooks apply (hard: 7-shot bursts, 3.0 s holds)

briefing:
  pages:
    - {speaker: Okafor, image: level-10-evacuation-route, line: "Nova Lagos evacuates at first light, Lancer. Five shuttles lift from Eko spaceport with eleven hundred people aboard. You and Rook are their corridor to the lagoon. Every shuttle we lose is two hundred and twenty lives."}
    - {speaker: Varga, image: level-10-wraith-scan, line: "The Vrell hunt evacuation flights from behind. Cloaked flyers pass overhead, then decloak at your six and fire up the screen. Flocks sweep past and turn back. Fit a rear gun, Lancer."}
  teaser: {speaker: Rook, line: "Shuttles to babysit and bugs that hit from behind. Bolt a gun on your tail, Lancer."}

backdrop:
  # Presentation only: the Nova Lagos evacuation corridor at first light (tools/art/backdrop_l10.py,
  # Level 08's production kit with Level 09's creep; D10 = a, D11 = a). Towers are scenery in true
  # perspective (section 3's creep districts and the suburbs' last blocks), clear of the ferry hatch.
  scroll_factors: {deep: 0.12, far: 0.45, ground: 1, low-air: 1.35, high-air: 2}
  ramp: 4
  haze_colour: 54484e  # rose-grey: the dawn haze over the water
  atmosphere:
    clear: {wisps: mist, haze: 0}   # sections 2 and 5: thin dawn mist only
    light: {banks: haze, wisps: mist, haze: 0.05}   # sections 1 and 4: dawn haze, drifting west
    medium: {banks: smoke-mist, wisps: wisps, haze: 0.12}   # section 3 and section 4's peak: smoke and sea mist, drifting west
  tile_sets:
    morning-sky: {layer: deep, height: 480}   # the dawn sky mirrored, gold in the east: seen only in the water
    spaceport: {layer: ground, height: 960}   # 1: Eko spaceport's apron (x 84-396), taxiways, hangars, the terminal
    suburbs: {layer: ground, height: 960}   # 2: the jammed motorway (x 176-304), refugee lights, houses, pitches
    viaduct: {layer: ground, height: 960}   # 3: the maglev viaduct (deck x 214-266) between the creep districts
    coast: {layer: ground, height: 960}   # 4: the village, the coast road (x 116-146), beach, water from x 168, sandbars
    open-lagoon: {layer: ground, height: 960}   # 5: the open lagoon (translucent), shoals, fish-trap stakes
    haze: {layer: low-air, height: 960, drift: -8}   # light: dawn haze and the city's smoke, drifting west
    smoke-mist: {layer: low-air, height: 960, drift: -14}   # medium: smoke and sea mist, drifting west
    mist: {layer: high-air, height: 960}   # clear and light: thin dawn mist (additive)
    wisps: {layer: high-air, height: 960}   # medium: smoke wisps (additive)
  pieces:
    cross-highway: {layer: ground, size: [480, 92]}   # an elevated cross highway (a causeway over the water); one over every section seam
    service-vehicles: {layer: ground, size: [48, 40]}   # a fuel bowser, a tug and a stair truck on the apron
    cdf-gunship: {layer: low-air, size: [44, 44], headings: 16}   # the CDF gunship (Level 08's model at dawn), 16 headings, 0 nose up, clockwise; scenery
    burnt-block-a: {layer: ground, size: [72, 82]}   # a collapsed block in the creep districts
    burnt-block-b: {layer: ground, size: [76, 82]}
    fire: {layer: ground, size: [40, 40], frames: 4, fps: 8}   # flames on the burnt blocks (section 3)
    smoke-column-a: {layer: low-air, size: [150, 200]}   # smoke plumes over the burning blocks (static)
    smoke-column-b: {layer: low-air, size: [130, 180]}
    maglev-train: {layer: ground, size: [16, 180]}   # a stalled maglev train on the viaduct's west guideway
    ferry: {layer: ground, size: [132, 264], mid_size: true}   # the capsized ferry on its sandbar; the hatch (a ground target) on its hull
    fishing-boats: {layer: ground, size: [56, 48]}   # pirogues drawn up on the beach
    buoy: {layer: ground, size: [16, 16], frames: 4, fps: 2}   # a channel buoy, its lamp blinking
    launch-pads: {layer: ground, size: [268, 198], mid_size: true}   # the five launch pads round the shuttles' t=1 points (the liftoff's `pads`)
