# Level 12 – Storm Front: the level script, rendered into README.md (briefing, threat profile, layout,
# waves, ground targets, radio, credit budget). Times are seconds from the level start (no holds, no
# arena: the level clock runs with the scroll). M5 part F, step 4 (user decisions F1–F9 of 2026-10-09
# and the stated defaults). Schema: ../../../tech/architecture/README.md#data-file-schemas
# The `backdrop` block and the sections' tiles are merged in from the round 34 backdrop proposal
# (concept/backdrop-proposal.yaml, tools/art/backdrop_l12.py --proposal, which reads this file).
scroll_speed: 140     # the chosen storm scene's swell
launch_seconds: 5     # flying in from the bottom edge with Rook in his slot, as in Levels 08-11
bounty_scale: 0.75    # every bounty × 0.75: the typical haul on budget(12) (M5 part F, step 4)
water: true           # open sea throughout: kills on the play field play the water burst (no `sub` units here)
drop_factor: 1.5      # shield cells: each enemy's drop `every` ÷ 1.5 (the Needler's 4th kill → 3rd) against the Lamprey drain
control_prompts: []
prompts:  # an event prompt (M5 part F): shown on every latch of 0.3 s or more, at most its seconds each time, until the attempt's first shake-off
  - {event: first-latch, action: SHAKE OFF, keys: 'LEFT-RIGHT', seconds: 6}
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: Earth ocean storm
  layers: [air, low-air]
  density: 4
  traits: [homing, spread]   # `side`, `rear` and `area` help against a latched Lamprey (the notes)
  hazards: [wind, low visibility]
  boss: none
  objective: SONDES 3   # the OBJECTIVE field from sensor L1: the secondary's three sondes
  varga:
    none: A storm off the Azores, Lancer, and it grew in hours. Air contacts inside it.
    l1: "From every side. Gusts will push you sideways: watch for the wind arrows."
    l2: "New: an eel that drains your shield. Shake it off."
    l3: Homing sees through the rain. Spread for the seeds.
  notes:
    Dominant layers: '`air`, `low-air` (Spore Bombers and the canister under the cloud banks)'
    Attack directions: '{directions}'
    Density: '{density}'
    Recommended traits: '`homing`, `spread`; `side` / `rear` / `area` help against a latched Lamprey'
    Hazards: Wind gusts (sideways push), low visibility (rain, cloud banks), lightning flashes
    Boss / mid-boss: 'none (finale: breakout from the storm, attacks from all sides)'
    Sensor-suite detail: '**none**: ocean storm, `air` + `low-air`, front. **L1**: + the directions, density {density}, hazards "wind, low visibility", the objective `{objective}`. **L2**: + Lamprey (new), Whirl Seed, Needler, Wraith, Mantis, Spore Bomber, Skitter portraits. **L3**: + `homing` and `spread` highlighted; the timeline strip marks the storm wall (125–150 s) and the eye (150–175 s); 1 secret.'

sections:  # back to back from t = 0; tiles: the backdrop's tile sets (tools/art/backdrop_l12.py --proposal); peak: another atmosphere inside the section
  - name: Squall Line
    end: 25
    atmosphere: light
    tiles: [swell, chop]
    notes:
      layers:
        deep: dark grey swell.
        low-air: the first scud banks at the edges.
        high-air: rain starts at t=10 (faint, motion-blurred streaks). One demonstration gust at t=16.
      purpose: Weather introduced over light popcorn; the gust telegraph learned.
  - name: Rain Wall
    end: 75
    atmosphere: medium
    tiles: [swell, chop]
    notes:
      layers:
        deep: heaving swell, sparse torn crests.
        low-air: scud banks (~20–25%), opaque, below the play plane.
        high-air: steady rain (≤ 40%). The first sonde blinks in the rain at t≈60.
      purpose: Lamprey introduction; seeds on the wind.
  - name: Lightning Field
    end: 125
    atmosphere: medium
    tiles: [swell, chop]
    notes:
      layers:
        low-air: as section 2, plus lightning every 6–10 s; each flash lights the cloud banks from inside for 0.5 s and shows what flies under them. The drifting canister at t≈99; the second sonde at t≈110.
      purpose: Low visibility; attacks from the sides and rear.
  - name: Storm Wall
    end: 150
    atmosphere: medium
    peak: {atmosphere: heavy, from: 130, to: 145}   # the single heavy peak, 5 s ramps each side
    tiles: [swell, chop]
    notes:
      layers:
        low-air: banks at 30–40% leaving the centre lane readable.
        high-air: dense rain (≤ 40%). A steady 20 px/s drift to the right plus gusts.
      purpose: 'The single heavy peak: dense whirl clusters and a Lamprey swarm.'
  - name: The Eye
    end: 175
    atmosphere: clear
    tiles: [swell, chop-calm]
    notes:
      layers:
        deep: calm dark sea with a shaft of pale light.
        far: the storm's cloud wall all round, turning slowly clockwise (≈ 3°/s). No rain, no gusts. The armour patch at t≈152; the third sonde at t≈165.
      purpose: Calm; Varga sees the Needlers circling with the storm.
  - name: Breakout
    end: 205
    atmosphere: medium
    peak: {atmosphere: light, from: 198, to: 205}   # the storm thinning toward the end
    tiles: [swell, chop]
    notes:
      layers:
        high-air: back through the wall into rain, which thins toward the end; the sky lightens at the top edge.
      purpose: Last waves from all sides, then out of the storm.

weather:  # M5 part F: the first level with weather; the eye (section 5) has none of it
  gusts:   # every gust from the left (the storm's wind); its push starts at t, telegraphed `telegraph` s ahead
    at:
      - {t: 16, from: left}    # the demonstration
      - {t: 52, from: left}
      - {t: 90, from: left}
      - {t: 118, from: left}
      - {t: 126, from: left}   # every 6 s in the storm wall, on top of its drift
      - {t: 132, from: left}
      - {t: 138, from: left}
      - {t: 144, from: left}
      - {t: 182, from: left}
    seconds: 2.5      # including the ramps
    ramp: 0.25        # s up and down
    push: 40          # px/s, added to the positions of the ship, Rook, the Lampreys and the Whirl Seeds
    telegraph: 1.0    # s ahead: the wind streaks brighten and an arrow shows at the upwind edge
    easy: {push: 25, telegraph: 1.5}
    hard: {push: 55, extra: [{t: 34, from: left}, {t: 72, from: left}]}
  drift: {section: 4, push: 20, from: left, easy: {push: 0}}   # the storm wall's steady drift to the right; none on easy
  lightning:   # flash times (the LIGHTNING event for the thunder); two while the canister is on the screen (99.5, 103.5); one at t=87 as the side swarm enters
    at: [78, 87, 93, 99.5, 103.5, 111, 117, 123, 129, 135, 141, 147, 180, 189]
    reveal: 0.5   # s the banks stay lit from inside
  occlusion: true   # F1 = a: the banks on low-air hide that layer's bodies (draw order only)
  rain: [[0, 0], [10, 0], [13, 0.25], [25, 0.4], [125, 0.4], [130, 1], [145, 1], [150, 0], [175, 0], [178, 0.4], [190, 0.3], [200, 0.1], [205, 0]]   # [t, density]: presentation only

# Act 2 popcorn (Skitter streams of 4 and snakes of 6, Whirl clusters of 6, Needler lines of 3) round the set
# pieces, from t=7 (the act's minimum: at least 50 a minute; the pacing rule: no empty screen over 3 s).
# The t=32 introduction alone: the popcorn before it leaves the screen first and nothing enters until t=40.
# Skitters cannot stream in from the rear (only chasers do), so the rear share is the Wraiths' and the
# Lampreys'. A whirl cluster on the wind is released just outside the left edge (at: x < 0).
waves:
  - {t: 7, formation: stream, enemy: skitter, count: 4, from: front, edge: right, interval: 1.25, notes: The first targets in the squall}
  - {t: 11, formation: snake, enemy: skitter, count: 6, from: front, edge: left}
