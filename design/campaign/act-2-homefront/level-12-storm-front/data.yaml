  - {t: 61, formation: stream, enemy: skitter, count: 4, from: sides, edge: right, interval: 1.25}
  - {t: 64, formation: line abreast, enemy: spore-bomber, count: 2, from: front, notes: 'Under the scud banks (`low-air`); spores rise to the play plane'}
  - {t: 70, formation: line abreast, enemy: needler, count: 3, from: front}
  - {t: 73, formation: whirl cluster, enemy: whirl-seed, count: 6, from: front, at: [140, 120]}
  - {t: 76, formation: stream, enemy: skitter, count: 3, from: front, edge: alternating, interval: 1}
  - {t: 80, formation: stream, enemy: skitter, count: 10, from: front, edge: alternating, interval: 0.75}
