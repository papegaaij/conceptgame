ground_targets:  # at: [t, x], when it enters at the top edge and its x
  - target: drifting canister
    section: 3
    layer: low-air
    size: [32, 24]
    sprite: supply-canister   # tools/art/l12_props.py: intact, hit, spent; supply-canister-glow over the bank
    hits: 3
    hard: {hits: 5}
    reveals: drifting canister
    drift: [-24, -70]   # px/s, y up: slowly across and down the screen inside a cloud bank on the right (≈ 8 s on screen), not pushed by the wind
    at: [[99, 420]]
    notes:
      target: 'A CDF supply canister drifting on `low-air` inside a cloud bank on the right (trigger, t≈99): drawn under the bank with a faint glint, fully seen in the flashes at t=99.5 and 103.5'
      effect: '{hits} hits (hard 5) by anything that reaches `low-air` break it open as the hidden crate'

secrets:
  - name: drifting canister
    crate: 130   # Act 1 terms: pays 208 with the act factor
    radio: {speaker: Varga, line: "A CDF supply canister. Lucky find in this soup."}

sondes:  # F7 = b: on the play plane, entering at the top edge at [t, x], drifting straight down; x off the waves' main lanes
  speed: 60     # px/s (≈ 9 s on the screen)
  radius: 36    # px from the ship's centre that collects one
  at: [[60, 400], [110, 70], [165, 390]]

pickups:
  - {pickup: overdrive, dropped_by: {wave: 104, unit: first}}   # the first Wraith of the t=104 ambush
  - {pickup: overdrive, dropped_by: {wave: 158, unit: first}}   # the t=158 Needler circle's leader
  - {pickup: armour patch, at: [152, 300]}                      # placed: floating in the eye

radio:  # trigger: t or event; requires: escort = only while Rook flies (hired, fitted and not ejected)
  - {t: 2, speaker: Okafor, line: "Weather service calls it the worst Atlantic storm in forty years. It formed in six hours. Stay together."}
  - {t: 14, speaker: Rook, requires: escort, line: "Feel that? The wind's trying to take the stick off me."}
  - {t: 30, speaker: Varga, line: "Eel-shaped contacts. They latch on and drain your shield. Shake hard to throw them off."}
  - {event: first-latch, speaker: Rook, requires: escort, line: "You've got a passenger! Shake it off!", notes: {trigger: "The attempt's first latch (`first-latch`)"}}
  - {t: 44, speaker: Rook, requires: escort, line: "Seeds on the wind, left side!"}
  - {t: 58, speaker: Varga, line: "There's a CDF sonde out there. Fly through it and I can read its data.", notes: {trigger: first sonde in view}}
  - {t: 86, speaker: Varga, line: "Lightning shows what's in the clouds. Watch the flashes."}
  - {t: 128, speaker: Okafor, line: "Storm wall ahead. Instruments will be useless in there. Fly by eye."}
  - {t: 149.5, speaker: Rook, requires: escort, line: "Blue sky. I'd almost forgotten what it looks like."}
  - {t: 157, speaker: Varga, line: "Lancer, look at them. They're circling with the wind. They aren't caught in this storm. They're steering it."}
  - {t: 169.5, speaker: The Choir, distorted: true, line: "[the Choir sings]"}
  - {t: 176, speaker: Okafor, line: "Say again, Doctor?"}
  - {t: 182.5, speaker: Varga, line: "They're herding the weather, Commander. They understand our climate better than we do."}
  - {t: 200, speaker: Rook, requires: escort, line: "Next time, I'm bringing an umbrella."}
  - {event: level-end, speaker: Okafor, line: "You're through. The storm is breaking up behind you, as if someone let it go."}
  - {event: secondary-objective, speaker: Varga, line: "Three sondes, full data. They fed the storm, Commander. I'll have the pattern by morning."}

objectives:
  primary: reach-end
  secondary: {collect: sondes, label: SONDES, credits: 75, name: Fly through all three sondes}   # all or nothing: met at the third, failed when one leaves the bottom edge uncollected (75 in Act 1 terms: pays 120)

music:
  track: 7            # Act 2 B "Firestorm" (audio/music track list)
  start_section: 2    # F5 = a: the storm ambience alone in the squall, the base stem from the rain wall
  full_section: 4     # the full mix in the storm wall
  stems: {5: base, 6: full}   # the base stem in the eye, the full mix again for the breakout
  section_db: {5: -6, 6: 0}   # the eye's base stem at -6 dB (the Choir's stage sound on top), full level again at the breakout
  ambience: earth-storm       # F6 = a: the rain-only storm bed
  ambience_changes:           # the ocean in the eye, the storm bed again at the breakout
    - {section: 5, ambience: earth-ocean, crossfade: 4}
    - {section: 6, ambience: earth-storm, crossfade: 4}
  end_jingle: mission-complete

difficulty: {}  # the t=136 swarm's easy 4 and the hard Mantis pincer are in their waves, the canister's hard hits in its own; the weather's easy/hard pushes in `weather`; the stat blocks' hooks apply (hard: two latched Lampreys draining 12/s)

briefing:
  pages:
    - {speaker: Okafor, image: level-12-storm-front, line: "Lancer, Aegis Actual. A storm system has formed off the Azores, and it's moving onto the convoy lanes faster than any storm should. Vrell flyers are using it as cover. Clear the storm front so the next convoy can follow. Expect contacts from every side."}
    - {speaker: Varga, image: level-12-sonde-scan, line: "The pressure readings make no sense. Three CDF weather sondes are still transmitting inside the front. Fly through them for me and I can tell you why."}
  teaser: {speaker: Rook, line: "A storm that blew up in six hours, and things in it that bite. Homing missiles, Lancer: you won't see much in there."}

backdrop:
  # Presentation only: the Atlantic storm (tools/art/backdrop_l12.py, straight from scene-storm-r10-a, F8 = a,
  # on Level 11's ocean kit). The sea is two layers: the long swell on `deep` (0.85, opaque) and the short
  # chop on `ground` (1.0, translucent); the eye has its own calm chop. Opaque scud banks on `low-air` (1.5).
  scroll_factors: {deep: 0.85, far: 0.9, ground: 1.0, low-air: 1.5, high-air: 2.2}
  ramp: 5
  haze_colour: 5a6670  # the rain's grey over the sea (none in the eye)
  atmosphere:
    clear: {haze: 0.0}   # the eye: no banks, no haze (the calm dark sea)
    light: {banks: scud-light, haze: 0.05}   # the squall line: scud at the edges ~12 %
    medium: {banks: scud-banks, haze: 0.1}   # rain wall, lightning field, breakout: scud banks ~22 %
    heavy: {banks: storm-banks, haze: 0.18}   # the wall's peak: banks ~35 %, the centre lane clear, the sea hazed
  tile_sets:
    swell: {layer: deep, height: 960}   # the storm's long swell and its slow tone field (opaque), every section; the chop slides over it (deep at 0.85)
    chop: {layer: ground, height: 960}   # the short chop, torn whitecaps and wind streaks from the left (translucent, alpha >= 3 everywhere: the shadow stencil), sections 1-4 and 6
    chop-calm: {layer: ground, height: 960}   # the eye's calm chop: the same chop at 30 %, no caps, no streaks
    scud-light: {layer: low-air, height: 960}   # light: the squall line's first scud at the edges, ~12 % cover, opaque cores
    scud-banks: {layer: low-air, height: 960}   # medium: dark scud banks ~22 %, opaque cores (they hide low-air bodies)
    storm-banks: {layer: low-air, height: 960}   # heavy: the wall's banks ~35 %, the centre lane kept clear
  pieces:
    sea-calm-in: {layer: ground, size: [480, 320]}   # on the eye's first seam: the storm's chop fading out over the calm one (320 px)
    sea-calm-out: {layer: ground, size: [480, 320]}   # on the eye's last seam: the storm's chop fading back in
    bank-tall-a: {layer: low-air, size: [256, 704]}   # a tall scud bank on the right: the drifting canister's cover
    bank-tall-b: {layer: low-air, size: [256, 704]}
  placed:
    # 3. Lightning Field: the canister's bank on the right (the canister enters at t 99, x 420, drifting -24, -70 px/s y up; it is under one of the two until it leaves at t 107.1)
    - {piece: bank-tall-a, t: 101.63, x: 380}
    - {piece: bank-tall-b, t: 104.31, x: 283}
    # 5. The Eye: the chop fades into the calm over the eye's first seam (ground position 21540) and back out of it under the last one (25040); exact rows, re-run after the data moves a section end
    - {piece: sea-calm-in, t: 153.071, x: 240}
    - {piece: sea-calm-out, t: 175.786, x: 240}
