# Level 14 – Siege Spire: the level script, rendered into README.md (briefing, threat profile, layout,
# waves, ground targets, radio, credit budget). Times are seconds from the level start; the level clock
# halts at the arena's end (t = 250) while the Siege Spire lives and jumps to it at the kill, so
# everything in the fight runs on the simulation's real steps and the arena's radio lines are events
# (M5 part H, step H4; decisions H1–H10 = a of 2026-10-11 and the stated defaults, pending the user's
# review in the combined round 36). Schema: ../../../tech/architecture/README.md#data-file-schemas
# The `backdrop` block is a placeholder (Level 09's megacity tiles, `images: level-09`) until the
# Geneva backdrop's proposal (tools/art/backdrop_l14.py --proposal, step H5) replaces it and the
# sections' tiles.
scroll_speed: 140     # the chosen Geneva scene's speed
launch_seconds: 5     # flying in from the bottom edge with Rook in his slot, as in Levels 08-13
bounty_scale: 0.76    # every bounty × 0.76: the typical haul on budget(14) (M5 part H, step H4)
control_prompts: []
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: Earth megacity
  layers: [ground, air, high-air]
  density: 4
  traits: [anti-ground, piercing]   # `rear` helps against the Wraiths (the notes): three traits do not fit the intel panel
  hazards: [root bursts]
  boss: Siege Spire
  objective: DESTROY THE SIEGE SPIRE   # the OBJECTIVE field from sensor L1
  varga:
    none: Geneva Concord, Lancer. Something has grown here for two nights, on the ground and in the air.
    l1: "Mostly from ahead. Roots break the streets: watch for the dust."
    l2: Root guns, hive nodes, cloaked Wraiths. And the Spire.
    l3: Bring anti-ground. When the crown opens, look behind you.
  notes:
    Dominant layers: '`ground` (the roots, the root-burst growths, the hive nodes, Creepers, Ravagers), `air`, `high-air` (cloaked Wraiths under the canopy)'
    Attack directions: '{directions} (the approach by its waves; in the boss fight the maw''s Wraiths loop round to the rear)'
    Density: '{density}'
    Recommended traits: '`anti-ground`, `piercing`; `rear` helps against the Wraiths (three traits do not fit the intel panel)'
    Hazards: Root bursts (telegraphed by dust, ground layer, no collision); low light under the canopy
    Boss / mid-boss: 'Act boss [Siege Spire](../../../enemies/bosses/siege-spire/README.md)'
    Sensor-suite detail: '**none**: Geneva Concord, `ground` + `air` + `high-air`, front. **L1**: + the directions, density {density}, hazard "root bursts", the objective `{objective}`. **L2**: + Creeper, Ravager, Hive Node, Wraith, Needler, Skitter, Spine Turret, Polyp Mortar portraits; the boss''s name and silhouette (`siege-spire`). **L3**: + `anti-ground` and `piercing` highlighted; the timeline strip marks the root field (60–95 s) and the boss (108 s); 1 secret.'

sections:  # back to back from t = 0; tiles: the backdrop's tile sets (step H5: tools/art/backdrop_l14.py)
  - name: Lakefront
    end: 20
    atmosphere: light
    tiles: [lakefront, canopy]
    notes:
      layers:
        deep: Lake Geneva at dusk, dark water.
        ground: the lakefront quays, the Jet d'Eau plume (leaning away from the screen centre, perspective rule), the Rhône bridges, a CDF armoured car half under creep on the Pont du Mont-Blanc (the secret).
        low-air: Hammer flight bombers passing below (scenery).
        high-air: the canopy's edge as a soft shadow (≤ 40 %).
      purpose: Set-up; light popcorn from t=7.
  - name: Old Town
    end: 60
    atmosphere: light
    tiles: [old-town, canopy]
    notes:
      layers:
        ground: perimeter blocks of row houses with ridged roofs and courtyards, the cathedral towers (leaning, perspective rule), sodium-lit streets, parks and tree rows, creep veins along the gutters, the Place du Molard with two hive nodes.
        high-air: canopy shadow.
      purpose: Creepers in the streets, a turret nest on the cathedral square, the hive-node pair.
  - name: Root Field
    end: 95
    speed: 80   # the scroll slows while the roots break the streets: a growth stands about 3 s on the screen once it fires (at 140 px/s it would have scrolled 350 px from its burst's dust)
    atmosphere: medium
    tiles: [root-field, canopy]
    notes:
      layers:
        ground: streets broken by roots as thick as trams; four root bursts split the paving (1 s dust telegraph each) and grow a Spine Turret and a Polyp Mortar; creep over the roofs.
        low-air: spore-haze banks lit violet from below.
      purpose: 'The signature set piece: roots growing guns. Ravagers out of a crater; the first Wraiths from behind.'
  - name: Concord Approach
    end: 108
    atmosphere: medium
    tiles: [root-field, canopy]
    notes:
      layers:
        ground: avenues converging on the Concord rotunda's roundabout; the Spire's trunk rising out of it, leaning away from the centre; roots radiating along the avenues.
        high-air: the canopy directly overhead.
      purpose: Last Wraiths; the Choir's song; the trunk grows on the horizon.
  - name: Siege Spire
    end: 250   # the scroll eases to a halt over the arena's first second (70 px); the level clock halts here while the Spire lives, a kill jumps it here
    speed: 0
    arena: true
    atmosphere: clear
    tiles: [root-field, canopy]
    notes:
      layers:
        ground: the arena around the rotunda, the trunk at the top, four turret-pod roots and two mortar roots spread along the avenues, all on the screen. Phase 3 the stump and the ground debris after the tear-free shockwave.
        high-air: canopy shadow only.
      purpose: The boss fight (≈ 135 s at medium); the warning, the arrival and the checkpoint at t=108.
  - name: Daylight
    end: 262
    speed: 25   # steps H7b and H9 (pending the user's review): a slow drift, so the stump stays on the screen while the light falls on it (at 140 px/s it left about 4 s after the kill, at 40 px/s about 9 s after, 10 s before the debrief)
    atmosphere: clear
    tiles: [daylight, canopy]
    notes:
      layers:
        ground: no enemies, no boss. The canopy withers and tears; low sunlight falls across the old town, the lake and the stump.
      purpose: Release; act complete.

boss:  # the act boss: anchored at the Concord rotunda, it scrolls in with the ground and engages at the halt
  enemy: siege-spire
  t: 108
  x: 240
  section: 5
  notes:
    from: front (anchored at the rotunda, scrolls in with the ground)
    waves: 'At the halt (the warning, the bar and the boss checkpoint); phase 2: the maw launches 2 Wraiths every 8 s (hard 3) as ambushes that loop to the rear'
    spawns: {wraith: 6}   # the maw's launches of a typical fight (the autopilot with the plan's fit at medium: 3 launches of 2), which the credit budget counts

# Act 2 popcorn (Skitter streams, snakes and line abreasts, Needler V-wings and lines) round the set
# pieces, a wave every 3-3.5 s (the act's minimum: at least 50 a minute; the pacing rule: no empty screen
# over 3 s), from the front and the sides; the two rear ambushes as authored. The root bursts'
# introduction keeps a quiet window: no wave enters from t=62 until t=67 (the first burst's dust at 63).
