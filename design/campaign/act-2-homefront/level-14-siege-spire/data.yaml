    hits: 6
    reveals: armoured car
    at: [[14.5, 330]]   # on the Pont du Mont-Blanc, its centre past the middle of the screen at t≈16.5
    notes:
      target: 'A CDF armoured car half under creep on the Pont du Mont-Blanc (trigger, t≈15)'
      effect: '{hits} hits clear the creep; the cargo hatch pops open as the hidden crate'
  - target: cathedral nest
    section: 2
    enemy: spine-turret
    count: 3
    at: [[38, 200], [38.4, 240], [38.8, 280]]
    notes:
      target: '[Spine Turret](../../../enemies/ground/spine-turret/README.md) turret nest ×{count} on the cathedral square (t≈38)'
      effect: Bounty
  - target: Molard nodes
    section: 2
    enemy: hive-node
    count: 2
    at: [[55, 150], [55.6, 330]]
    notes:
      target: '[Hive Node](../../../enemies/ground/hive-node/README.md) ×{count} in the Place du Molard, hardened (t≈55)'
      effect: 'Optional: each releases 2 Skitters while alive (the budget counts one release each)'
  - target: hard Molard nest
    section: 2
    enemy: spine-turret
    count: 0
    at: []
    hard: {at: [[55.3, 200], [55.6, 240], [55.9, 280]]}
    notes:
      target: Spine Turret nest ×3 beside the hive nodes (t≈55), **hard only**
      effect: Bounty

root_bursts:  # M5 part H (H2 = a): t = the telegraph's start; x, y the point, px from the left and below the top edge then (100-400); it scrolls with the ground
  telegraph: 1.0         # s of the cracking paving and the dust
  first_shot_delay: 0.75  # s the growths grow, invulnerable and silent, before they fire (step H7b: 1.5 fired them ≈220 px above the bottom edge, on the ship; now ≈280, pending the user's review)
  spacing: 52            # px between a burst's two growths (tools/art/root_burst.py's growth points, ±26)
  group: roots           # the secondary's group
  hard: {first_shot_delay: 0.5}
  bursts:
    - {t: 63, x: 150, y: 120, growths: [spine-turret, polyp-mortar], easy: {growths: [spine-turret]}, notes: The introduction (Okafor at t=62); no wave enters t=62-67}
    - {t: 74, x: 330, y: 110, growths: [spine-turret, polyp-mortar], easy: {growths: [spine-turret]}}
    - {t: 84, x: 170, y: 140, growths: [spine-turret, polyp-mortar], easy: {growths: [spine-turret]}}
    - {t: 92, x: 320, y: 100, growths: [spine-turret, polyp-mortar], easy: {growths: [spine-turret]}}

secrets:
  - name: armoured car
    crate: 88   # Act 1 terms: pays 141 with the act factor
    radio: {speaker: Okafor, line: "That car's crew left their supplies behind. They'd want you to have them, Lancer."}

drops:  # step H9 (pending the user's review): the CDF supply drone (Level 13's) flies in from the bottom edge, releases its armour patch at [x, y up] at t and leaves the way it came
  - {t: 100, x: 240, y: 380, pickup: armour patch, sprite: supply-drone}

pickups:
  - {pickup: overdrive, dropped_by: {wave: 72, unit: first}}         # the Ravager pack's leader
  - {pickup: overdrive, dropped_by: {parts: [maw], unit: first}}      # the maw's death (phase 2 to 3)

radio:  # trigger: t or event; requires: escort = only while Rook flies (hired, fitted and not ejected); the arena's lines are events (the level clock is halted)
  - {t: 1, speaker: Okafor, line: "All units, Aegis Actual. Everything the Coalition has left is in the air over Geneva tonight. Make it count."}
  - {t: 13, speaker: Hammer Lead, portrait: generic-cdf, line: "Hammer flight on station. Call your targets, Aegis."}
  - {t: 21, speaker: Rook, requires: escort, line: "Lancer, whatever happens in there, I'm on your wing. As usual."}
  - {t: 31.5, speaker: Varga, line: "The canopy is one organism. The roots feed the trunk. Kill the roots and the trunk starves."}
  - {t: 54, speaker: Varga, line: "Hive nodes in the Molard. Hardened, like Lagos."}
  - {t: 62, speaker: Okafor, line: "Roots surfacing in the streets! They're growing guns."}
  - {t: 96, speaker: The Choir, distorted: true, line: "[the Choir sings]"}
  - {t: 102, speaker: Varga, line: "It's singing to the whole city. Lancer, that's the Spire."}
  - {event: boss-phase, phase: Maw, speaker: Varga, line: "The crown is opening. It's launching flyers, and they'll loop behind you.", notes: {trigger: "Phase 2 (`boss-phase` Maw)"}}
  - {event: boss-phase, phase: Free spire, speaker: Okafor, expression: fierce, line: "It's tearing loose! Stay on it, Lancer!", notes: {trigger: "Phase 3 (`boss-phase` Free spire)"}}
  - {event: boss-phase, phase: Free spire, speaker: Rook, requires: escort, line: "Roots and all. Somebody call a gardener.", notes: {trigger: "Phase 3, queued after Okafor's line"}}
  - {event: boss-destroyed, speaker: Varga, line: "The canopy's dying. All of it, all at once.", notes: {trigger: "Spire destroyed (`boss-destroyed`)"}}
  - {event: secondary-objective, speaker: Okafor, line: "Root grid in the old town destroyed. The engineers will thank you."}
  - {event: level-end, speaker: Okafor, line: "Every Vrell on Earth just lost its voice. They're scattering. We take the fight to them now.", notes: {trigger: "Level end (the closing line)"}}

objectives:
  primary: reach-end   # the arena makes the kill a condition of the level's end
  secondary: {groups: [roots], label: ROOTS, credits: 63, name: Destroy every root-burst growth}   # all 8 growths (easy 4) before they leave the screen (63 in Act 1 terms: pays 101)

music:
  track: 7            # Act 2 B "Firestorm" (audio/music track list)
  start_section: 2    # the base stem from the Old Town; section 1 has the ambience only
  full_section: 4     # the full mix from the Concord approach
  ambience: earth-canopy   # the canopy's hum instead of the megacity's sirens (round 36 a); at the Spire's death it fades out over 2 s and the megacity's ambience rises over 7 s (step H6)
  end_jingle: mission-complete
  boss_warning: boss-warning      # track 22 with the klaxon and the banner at the Spire's arrival
  boss_track: choir-descends      # track 18 after the warning, fading out at the kill; the daylight without music

difficulty: {}  # easy's Spine-Turret-only bursts and hard's growth delay are in root_bursts; the easy Needlers at t=82 and the hard Molard nest in their entries; the stat blocks' hooks apply (hard: the Spire's ring of 12, 180° sweep and 3 Wraiths a launch)

briefing:
  pages:   # texts shortened to the 4 lines a page with an image holds (step H5; pending the user's review)
    - {speaker: Okafor, image: level-14-spire-over-geneva, line: "Lancer, Aegis Actual. Something grew out of Geneva Concord two nights ago: the Siege Spire, three kilometres tall and still growing. Your flight goes in first, along the lakefront and through the old town to the rotunda. Destroy it. Aegis Actual out."}
    - {speaker: Varga, image: level-14-root-scan, line: "The Vrell fight as one, and I believe the Spire binds them. Its roots run under the old town and grow guns where they break the surface. Kill the roots and the trunk starves. Bring anti-ground and something that pierces. When the crown opens, look behind you."}
  teaser: {speaker: Rook, line: "Roots first, flyers from behind, then the Spire. I'll take the six o'clock."}

backdrop:
  # Presentation only: Geneva Concord under the Vrell canopy (tools/art/backdrop_l14.py, straight from
  # scene-geneva-r10-a, H8 = a; M5 part H, step H5). No deep layer: the ground tiles are opaque (the lake
  # painted on them); the canopy's shadow is baked into them, its veins on high-air. Sections 4-6 are one
  # strip of pieces (the arena halts: its own tile set is never drawn); boulevards hide the tile seams.
  # Motion budget: Hammer flight and the few moving cars (sections 1-2); nothing moves in the arena.
  scroll_factors: {far: 0.9, ground: 1, low-air: 1.35, high-air: 2}
  ramp: 4
  haze_colour: 3a2c48  # unused: no deep or far layer
  atmosphere:
    clear: {haze: 0}   # the arena and the daylight: the canopy's veins only
    light: {banks: haze-light, haze: 0}   # sections 1-2: thin spore haze
    medium: {banks: spore-haze, haze: 0}   # sections 3-4: spore-haze banks lit violet from below
  tile_sets:
    lakefront: {layer: ground, height: 960}   # section 1: Lake Geneva at dusk on the left, the quays and the promenade, the 19th-century blocks; the canopy's shadow lighter (its edge)
    old-town: {layer: ground, height: 960}   # section 2: perimeter blocks of row houses, tile roofs, sodium-lit streets, parks, creep veins in the gutters, the canopy's mottled shadow
    root-field: {layer: ground, height: 960}   # section 3 (and under the strip in 4-5): streets broken by roots as thick as trams, cracked paving, collapsed houses, creep over the roofs
    daylight: {layer: ground, height: 960}   # section 6 after the strip: the old town in the low sun (daylight look a), lamps out, the creep withered
    haze-light: {layer: low-air, height: 960}   # light: thin spore haze, ~10 %, still on its layer
    spore-haze: {layer: low-air, height: 960}   # medium: spore-haze banks lit violet from below, ~22 %, spores
    canopy: {layer: high-air, height: 540}   # the canopy's teal veins (additive at 40 %), every section; period 540 as the game's canopy-tear frames
  pieces:
    boulevard: {layer: ground, size: [480, 48]}   # a tree-lined boulevard with tram rails: over every seam between two tile sets (dusk)
    boulevard-day: {layer: ground, size: [480, 48]}   # the same in the daylight (the strip's top, over the daylight tiles)
    rhone: {layer: ground, size: [480, 168]}   # the Rhone leaving the lake, the Pont du Mont-Blanc under the armoured car, the Ile Rousseau, the avenue's bridge
    jet-deau: {layer: ground, size: [112, 144], mid_size: true}   # the Jet d'Eau: its jetty and lighthouse, the plume leaning away from the centre, static
    cathedral: {layer: ground, size: [480, 232], mid_size: true}   # Saint-Pierre on its cobbled square: nave, transept and apse, the turret nest's square in front; its towers are tower pieces
    cathedral-tower: {layer: ground, size: [12, 12], tower: {height: 0.42, wall: wall-stone, shade: 0.55}}   # a west tower of Saint-Pierre in perspective: limestone walls, a verdigris pyramid
    molard: {layer: ground, size: [480, 200], mid_size: true}   # the Place du Molard: the square under the two hive nodes, creep round them
    root-crater: {layer: ground, size: [128, 112]}   # the Ravager pack's crater: root burst a's last frames (no growths)
    traffic-car: {layer: ground, size: [14, 28], headings: 2}   # a car with its headlights, up (0) or down (1) the avenue: the few still moving
    hammer-flight: {layer: low-air, size: [136, 120], headings: 2}   # Hammer flight: three CDF bombers in a vee, heading up (0) or down (1)
    concord-1: {layer: ground, size: [480, 577]}   # the strip: the approach, the arena round the rotunda, the daylight
    concord-2: {layer: ground, size: [480, 578]}
    concord-3: {layer: ground, size: [480, 578]}
    concord-4: {layer: ground, size: [480, 577]}
