# Level 13 – Polar Relay: the level script, rendered into README.md (briefing, threat profile, layout,
# waves, ground targets, radio, credit budget). Times are seconds from the level start: the timed halt
# (sections 2-4, speed 0 without an arena) keeps the level clock running, so every time is the clock's
# (M5 part G, step G4; user decisions G1–G9 = a of 2026-10-11 and the stated defaults, pending the
# user's review in the combined round). Schema: ../../../tech/architecture/README.md#data-file-schemas
# Screen places in the halt are fixed (the ground stands): x px from the left edge, y px below the top
# edge, except where a key says y up (the defend's `at`, the drops, a side nest's `at`).
scroll_speed: 140     # the arctic scene's pack ice
launch_seconds: 5     # flying in from the bottom edge with Rook in his slot, as in Levels 08-12
bounty_scale: 0.67    # every bounty × 0.67: the typical haul on budget(13) (M5 part G, step G4)
water: true           # E1 = a: the whole play field is water in the simulation (the torpedo reaches every ground unit)
water_splash: naval-only   # G5 = a: only a burst on a Skimmer and its death play the water splash; the ice gets the ground burst
control_prompts: []
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: Earth arctic
  layers: [ground, air]
  density: 4
  traits: [spread, rear]   # `side` helps too (the notes): three traits do not fit the intel panel
  hazards: [whiteout]
  boss: none
  objective: DEFEND NANSEN RELAY   # the OBJECTIVE field from sensor L1
  varga:
    none: Pack ice, Lancer. Boats in the leads, walkers on the floes, and no front line out there.
    l1: They'll come from all four edges. Side and rear guns will earn their keep.
    l2: "New: the Skimmer, a fast boat that weaves. The walkers are back, and the divers."
    l3: Spread fire for the boats, side shots for the walkers. Hold the relay for three minutes.
  notes:
    Dominant layers: '`ground` (Scuttlers on the floes, the Polyp Mortars, the Skimmers on the leads, naval surface), `air`'
    Attack directions: '{directions} (a `defend` level: **excepted** from the campaign''s "at least ~60 % of waves enter from the top edge" rule; the `cross` waves split evenly over the four edges)'
    Density: '{density}'
    Recommended traits: '`spread`, `rear`; `side` helps too (three traits do not fit the intel panel)'
    Hazards: Whiteout (edge visibility, final push); the relay must survive
    Boss / mid-boss: 'none (finale: the whiteout push)'
    Sensor-suite detail: '**none**: arctic, ground + air, all directions. **L1**: + the directions, density {density}, hazard "whiteout", the objective `{objective}`. **L2**: + Skimmer (new), Needler, Scuttler, Mantis, Stinger, Skitter, Polyp Mortar portraits. **L3**: + `spread` and `rear` highlighted; the timeline strip marks the three defend phases and the whiteout (new marks, step G6); 1 secret.'

sections:  # back to back from t = 0; tiles: the backdrop's tile sets (the halt's sections all begin at its top edge, so the halt shows section 1's ground: the strip of pieces)
  - name: Pack Ice
    end: 40
    atmosphere: light
    tiles: [arctic-water]
    notes:
      layers:
        deep: dark open water under the ice.
        ground: white-blue ice floes with open leads, teal submerged ice edges, waterline foam (Water rules), an abandoned research hut (the secret), the relay entering at the top at t≈37.
        low-air: thin fog wisps. Low sun, long cool shadows.
      purpose: Skimmer introduction during the approach; the scroll eases to 0 over t=38–40, arriving at the relay.
  - name: First Light
    end: 100
    speed: 0          # the timed halt (defend phase 1): the level clock runs on, the ground stands
    ramp: 2           # s the scroll eases down before the halt (t=38–40)
    atmosphere: light
    tiles: [arctic-water]
    notes:
      layers:
        ground: Nansen Relay at the centre on its floe, the lanes (leads) cut round it, loose floes drifting slowly, Skimmer wakes in the leads.
      purpose: 'Learn to guard a point: boats from all edges.'
  - name: Floe Walkers
    end: 160
    speed: 0          # defend phase 2
    atmosphere: light
    peak: {atmosphere: medium, from: 140, to: 160}   # the fog thickening from t=140 (an atmosphere split at a time: the peak runs to the section's end)
    tiles: [arctic-water]
    notes:
      layers:
        ground: as above, with Scuttlers striding across the floes from the sides.
        low-air: fog thickening at the edges from t=140.
      purpose: 'Walkers with armoured fronts: hit them from the side; side attackers.'
  - name: Whiteout
    end: 220
    speed: 0          # defend phase 3
    ramp: 2           # s the scroll eases back up after the halt (t=220–222)
    atmosphere: medium
    peak: {atmosphere: heavy, from: 176, to: 188, easy: 6, ambience_db: 3}   # the whiteout, 4 s ramps (the backdrop's); easy: 6 s centred (presentation), the wind +3 dB (step G6)
    tiles: [arctic-water]
    notes:
      layers:
        low-air: whiteout banks rolling in from the side edges, 25–40 % coverage at the edges, the centre around the relay kept readable.
        high-air: snow streaks (≤ 40 %) falling on the real clock.
      purpose: The final push in poor visibility; edge warnings still show through the whiteout.
  - name: Grid Online
    end: 235
    atmosphere: clear
    tiles: [arctic-water, open-floes]
    notes:
      layers:
        ground: the relay's lights coming on in sequence, then floes and open sea northward.
      purpose: Release; level end.

# The hooked and featured waves of the approved draft (retimed only where marked) and the unhooked
# popcorn (Skitter streams and line abreasts, Needler lines and pincers) from all edges, to the act's
# minimum of 50 a minute over the whole clock (G3 = a: halted time counts) and the pacing rule (no empty
# screen over 3 s), the t=20 introduction alone. Skitters reach the rear as a line abreast or on a snake's
# path (only chasers stream in from the rear); a V-wing enters only from the front.
# The Skimmers' lanes in the halt run along the leads round the relay's floe: the north lead (y ≈ 95), the
# south lead (y ≈ 460), the west lead (x ≈ 75) and the east lead (x ≈ 405); the relay stands at (240, 250).
