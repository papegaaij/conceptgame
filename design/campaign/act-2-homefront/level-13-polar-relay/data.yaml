  - {t: 5, formation: stream, enemy: skitter, count: 6, from: front, edge: alternating, interval: 1.5, notes: The first targets over the pack ice}
  - {t: 11, formation: line abreast, enemy: needler, count: 3, from: front}
  - t: 20
    formation: convoy
    enemy: skimmer
    count: 3
    from: front
    easy: {count: 3}   # all three on easy too: the introduction fills its stretch
    lanes: [[[40, -40], [300, -80], [440, -200], [240, -400], [20, -560], [-60, -600]]]   # a lead winding across the scrolling ice (its ground places at t=20): an S across the upper screen, off the left edge
