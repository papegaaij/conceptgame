ground_targets:  # at: [t, x], when it enters at the top edge and its x; a nest from a side: [t, y up]
  - target: research hut
    section: 1
    layer: ground
    size: [48, 40]
    sprite: research-hut   # tools/art/l13_props.py: intact, one hit, two hits, opened; research-hut-glow the hatch beacon
    hits: 3
    reveals: research hut cache
    at: [[12, 380]]
    notes:
      target: 'Abandoned research hut, its roof hatch blinking (trigger, t≈12)'
      effect: '{hits} hits on the hatch release the hidden crate (the secret)'
  - target: mortar floe
    section: 2
    enemy: polyp-mortar
    count: 2
    side: {from: left, drift: 10}   # px/s across the screen: the floe takes ≈ 48 s to cross while the ground stands
    at: [[66, 440], [66, 400]]      # [t, y up]: two mortars on one floe, in from the left edge above the relay
    notes:
      target: '[Polyp Mortar](../../../enemies/ground/polyp-mortar/README.md) ×{count} on **one floe** entering from the left edge and drifting right at 10 px/s (t≈66)'
      effect: 'A nest entering at a side edge with a drift. They target the relay (`always`): each lob''s marker lies on it, the direct hit lands on it; ≈ 13 lobs each while the floe crosses unless killed (the gap analysis''s biggest relay risk; measured in step G4, the guarding autopilot kills the floe before it lands a lob on medium, ≈ 50 damage on hard: the Scuttlers'' fans are the load); side-edge warning; credits'

secrets:
  - name: research hut cache
    crate: 110   # Act 1 terms: pays 176 with the act factor
    radio: {speaker: Varga, line: "A CDF research cache. Somebody left that hut in a hurry."}

drops:  # M5 part G (G6 = a): the supply drones' armour patches, released at [x, y up] at t; the drone's arc from the relay's helipad is presentation
  - {t: 162, x: 240, y: 380, pickup: armour patch, sprite: supply-drone}
  - {t: 202, x: 240, y: 380, pickup: armour patch, sprite: supply-drone}

pickups:
  - {pickup: overdrive, dropped_by: {wave: 124, unit: first}}   # the first Mantis of the t=124 pincer

radio:  # trigger: t or event; requires: escort = only while Rook flies (hired, fitted and not ejected); Nansen is uncast until round 35 (his lines play as text).
# Retimed in step G4 to the 1 s rule with every line as text (RadioTimelineTest): each timed line starts when the one
# before has closed; the secondary's line fits between Nansen's t=218 and Okafor's t=233.5. Step G6 rendered the cast
# speakers' lines (Okafor, Varga, Rook) and checked the times against the voices: no voiced timed line starts more than
# 1 s late, so none moved (Nansen's lines play as text until round 35 casts him; recheck then).
  - {t: 1, speaker: Okafor, line: "Nansen Relay coordinates every gun on the planet. If it goes dark, so does the grid."}
  - {t: 13, speaker: Varga, line: "Fast boats in the leads. They weave. Lead your shots, or spray."}   # before the introduction at t=20
  - {t: 24, speaker: Rook, requires: escort, line: "Cold enough for you, Lancer? My canopy's frosting on the inside."}
  - {t: 36, speaker: Nansen, portrait: generic-cdf, line: "Aegis, Nansen. Very glad to see you. They come at us from every direction out here."}
  - {t: 47.5, speaker: Okafor, line: "Lancer, you're holding station over the relay. Nothing touches it."}
  - {t: 58.5, speaker: Rook, requires: escort, line: "Contacts, all sides! Pick a direction, any direction."}
  - {t: 102, speaker: Varga, line: "Walkers on the floes. Their claws are armoured from the front. Hit them from the side."}
  - {t: 154, speaker: Okafor, line: "Divers inbound. They're going for the relay, not you."}
  - {t: 162, speaker: Nansen, portrait: generic-cdf, line: "Supply drone away. Catch it, Aegis.", notes: {trigger: "the first drone's release"}}
  - {t: 172, speaker: Okafor, line: "Weather's turning. Whiteout coming in from the edges."}
  - {t: 179, speaker: The Choir, distorted: true, line: "[the Choir sings]"}
  - {event: ally-below, below: 0.5, speaker: Nansen, portrait: generic-cdf, line: "Integrity at half! We can't take much more!", notes: {trigger: "Relay below 50 % (`ally-below` 0.5)"}}
  - {event: ally-below, below: 0.25, speaker: Okafor, line: "Lancer, the relay is failing. Everything else can wait.", notes: {trigger: "Relay below 25 % (`ally-below` 0.25)"}}
  - {t: 218, speaker: Nansen, portrait: generic-cdf, line: "Grid sync complete. Every battery on Earth just came back online."}
  - {event: secondary-objective, speaker: Nansen, portrait: generic-cdf, line: "Integrity holding above half. You kept the lights on, Aegis."}
  - {t: 233.5, speaker: Okafor, line: "Well held, Aegis. Now we can see the whole board.", notes: {trigger: "t=233.5 (after the secondary's line)"}}
  - {event: level-end, speaker: Rook, requires: escort, line: "Next time they need a relay defended, I'm asking for one with palm trees."}
  - {event: mission-failed, speaker: Okafor, line: "Nansen is gone. Pull back, Lancer.", notes: {trigger: "Relay destroyed (`mission-failed`)"}}

objectives:
  primary: defend
  defend:   # M5 part G: the first defend primary (G1, G2 = a)
    ally: nansen-relay
    at: [240, 290]      # x px from the left edge, y px from the bottom edge (y up): it stands there from t=40 (it enters at the top at t≈37)
    from: 40            # the synchronisation starts with the halt
    duration: 178       # s: complete at t=218 (the secondary is judged then), the scroll resumes at t=220
    targeted_by: {skimmer: alternate, scuttler: in-arc, stinger: always, polyp-mortar: always}   # the hook's modes (G1 = a); the popcorn and the Mantis are never hooked
    # Integrity (G2 = a, tuned in step G4 with the guarding autopilot over 8 seeds; the draft's 900 / 600 / 450):
    # medium 240 (the ally's hp: it loses 112–124, the median seed ending at exactly 50 %), easy 340 (loses
    # 48–56), hard 520 (loses 386–410: hard's 7-way Scuttler fans, larger pincers and tougher walkers make its
    # load 3.4 × medium's; it never falls, the secondary is never met)
    easy: {hp: 340, targeted_by: {stinger: none}}   # easy: the Stingers dive at the player
    hard: {hp: 520}
  secondary: {integrity: 0.5, label: INTEGRITY, credits: 95, name: Keep the relay at 50 % or more}   # failed at once below half, met at t=218 (95 in Act 1 terms: pays 152)

music:
  track: 6            # Act 2 A "Homefront" (audio/music track list)
  start_section: 2    # the arctic ambience alone in section 1, the base stem from the halt
  full_section: 4     # the full mix in the whiteout
  ambience: earth-arctic   # AMBIENCE_ARCTIC (ambience-arctic-r08-a.ogg; the game's key in step G6), ≈ +3 dB in the whiteout peak
  end_jingle: mission-complete
  jingle: {t: 218, fade: 2.6}   # G8 = a: the jingle once under "Grid sync complete", the theme faded out first; the debrief without it. The fade (step G8: 2.6 s, was 1) lasts grid online's 2.6 s chord, so the jingle starts as the chord ends (t 220.6)

difficulty: {}  # the relay's integrity and easy's unhooked Stingers are in the defend block; the t=118 cross's hard 8 and the t=210 Stingers' hard pairs in their waves; the stat blocks' hooks apply (hard: the Skimmers' 2-shot bursts, the Scuttlers' 7-way fan)

briefing:
  pages:   # texts shortened to the 4 lines a page with an image holds (step G5; pending the user's review)
    - {speaker: Okafor, image: level-13-relay-grid, line: "Lancer, Aegis Actual. Nansen Relay ties every gun on the planet into one defence grid, and a Vrell landing force is crossing the pack ice to it. Hold over the relay for three minutes while it synchronises. They will come from every side. Aegis Actual out."}
    - {speaker: Varga, image: level-13-ice-field, line: "Fast boats weave in the leads: lead your shots or spray. Walkers' claws are armoured in front, so hit them from the side. Shots at the relay are aimed at it: stand in the way. Side and rear guns will earn their keep."}
  teaser: {speaker: Rook, line: "Defend the Arctic relay for three minutes. Attacks from every edge: rear and side guns pay off."}

backdrop:
  # Presentation only: the pack ice round Nansen Relay (tools/art/backdrop_l13.py, straight from
  # scene-arctic-r09-a, G9 = a; M5 part G, step G5). The ground is one unique strip (pack-ice-1..4, the
  # approach and the halt's frame, the leads cut along the waves' lanes) over the drifting `deep` water;
  # the exit's `open-floes`; fog and the whiteout (whiteout_l13 look a) as the atmosphere's banks.
  scroll_factors: {deep: 0.85, far: 0.9, ground: 1.0, low-air: 1.5, high-air: 2.2}
  ramp: 4
  haze_colour: a8b8c4  # the arctic's pale grey-blue over the water
  atmosphere:
    clear: {haze: 0.0}   # the exit: no fog
    light: {banks: fog-wisps, haze: 0.04}   # thin fog wisps ~10 %
