# Level 09 – Arcology Fall: the level script, rendered into README.md (briefing, threat profile,
# layout, waves, ground targets, radio, credit budget). Times are SCRIPT time (user decision D2 = a
# of M5 part C): the scroll distance ÷ 150 px/s. In a hold zone the level clock slows with the
# scroll, so waves, ground targets, radio t-lines and the backdrop's placements wait with it.
# Schema: ../../../tech/architecture/README.md#data-file-schemas
scroll_speed: 150
launch_seconds: 5     # flying in from the bottom edge with Rook in his slot, as in Level 08
bounty_scale: 0.4    # every bounty × 0.4: the typical haul on budget(9) (M5 part C, step C3)
control_prompts: []
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: Earth megacity
  layers: [ground, air]
  density: 3
  traits: [anti-ground, area]
  required: [anti-ground]   # D7 = a: the launch warning at every sensor level without a source that damages hardened targets
  hazards: [structural collapse]
  boss: none
  objective: DESTROY 6 HIVE NODES   # the OBJECTIVE field from sensor L1
  varga:
    none: The arcology district before dawn, Lancer. Things on the ground that must die, and flyers over them.
    l1: Mostly from ahead, two pincers from the flanks. Six targets to destroy, and a tower may fall. It won't touch you.
    l2: "New: the Hive Node, a hardened spawner, and the Ravager, a pack hunter that pounces. Creepers and turrets too."
    l3: "Anti-ground is a must: nothing else cracks a node. One cache: a creep cocoon on a boulevard roof. Bomb it open."
  notes:
    Dominant layers: '`ground` (hive nodes, Ravager packs, Creepers, turrets, mortars), `air`; `low-air` carries smoke and dust (scenery)'
    Attack directions: '{directions} by enemy count (two Needler pincers)'
    Density: '{density}'
    Recommended traits: '`anti-ground` (**required**, user decision D7 = a), `area`'
    Hazards: the arcology collapse (scripted, on the ground layer, harmless to the player)
    Boss / mid-boss: 'none (finale: the third hold and the collapse)'
    Sensor-suite detail: 'none: Earth megacity before dawn, `ground` + `air`, front · L1: + directions, density {density}, the hazard "structural collapse", the objective `{objective}` · L2: + Hive Node (new), Ravager (new), Skitter, Needler, Stinger, Creeper, Spine Turret and Polyp Mortar portraits; no boss · L3: + `anti-ground` and `area` highlighted, the wave strip marking the three node clusters (37, 119 and 163 s), 1 secret'

sections:  # back to back from t = 0; tiles: the backdrop's tile sets (tools/art/backdrop_l09.py --proposal)
  - name: Arcology Approach
    end: 20
    atmosphere: light
    tiles: [pre-dawn, approach]
    notes:
      layers:
        deep: the sprawl's glow under the smoke haze, a grey glow in the east.
        ground: a ruined elevated highway, burnt-out traffic, a CDF barricade; the first arcology towers in perspective with violet creep veins on their upper floors.
        low-air: smoke wisps.
      purpose: Launch and set-up; the first creep seen on the towers.
  - name: Unity Plaza
    end: 58
    atmosphere: clear
    tiles: [pre-dawn, plaza-district]
    notes:
      layers:
        ground: a wide plaza with a dry fountain, the creep spreading from nodes A1 and A2 across the paving, park trees at the edges, the turret pair; towers around it.
        low-air: none (the plaza must read clearly).
      purpose: 'First hold zone (30 px/s in hold A): learn that nodes need anti-ground and that the scroll waits for you.'
  - name: Boulevard Run
    end: 96
    atmosphere: light
    tiles: [pre-dawn, boulevard]
    notes:
      layers:
        ground: a long boulevard with a burnt-out tram, abandoned cars and tree rows; low roofs either side (the mortars, a turret nest, the cocoon); towers in perspective.
        low-air: dust drifting off the street.
      purpose: 'Ravager introduction: one pack alone, then a larger pack around the tram; the cocoon secret.'
  - name: Okonjo Bridge
    end: 138
    atmosphere: medium
    tiles: [pre-dawn, lagoon]
    notes:
      layers:
        ground: the lagoon channel, the Okonjo Bridge running up the screen with the Kilo truck convoy crossing it, the far bank's quay with two mortars, the bridgehead turrets, nodes B1 and B2 on the south-bank approach.
        low-air: smoke banks over the water.
      purpose: 'The bridge assault (the secondary), then the second hold (30 px/s in hold B).'
  - name: Arcology Fall
    end: 186
    atmosphere: medium
    tiles: [pre-dawn, lobby-district]
    notes:
      layers:
        ground: the Ndidi Arcology's lobby plaza with nodes C1 and C2, the arcology tower hollowed by creep; after the collapse its rubble heap under settling dust.
        low-air: smoke, then the collapse's `heavy` dust banks, ramping out over 6 s.
      purpose: 'Third hold (30 px/s in hold C), then the collapse set piece and a quiet end over the rubble.'

# Skitter streams and snakes, Needler and Stinger groups of the level's own roster between the
# node clusters and the Ravager packs (the act's minimum: at least 50 a minute of script time).
# Walker paths: [x, y] points in screen coordinates at the unit's entry (y px below the top edge),
# scrolling with the ground; past the last point a walker walks straight on. Creepers walk north
# (up the screen, so the ground carries them down at 150 - 35 = 115 px/s), a convoy's units 1.5 s
# apart on one path. A Ravager pack's units enter 0.25 s apart, each on its own path (as many paths
# as the largest difficulty's count): they gallop down into the street, then across it at a shallow
# angle (about 90 px/s down the screen at the full scroll), within pouncing range of the ship.
