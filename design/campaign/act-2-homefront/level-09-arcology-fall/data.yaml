holds:  # D3 = a: no timeout; a node that leaves the screen alive fails the mission at once (D1 = a)
  - {groups: [Node A1, Node A2], y: 200, speed: 30, easy: {speed: 20}, hard: {speed: 40}, ramp: 1}
  - {groups: [Node B1, Node B2], y: 200, speed: 30, easy: {speed: 20}, hard: {speed: 40}, ramp: 1}
  - {groups: [Node C1, Node C2], y: 200, speed: 30, easy: {speed: 20}, hard: {speed: 40}, ramp: 1}

collapse:  # D5 = a, round 31's look c: the Ndidi Arcology (the backdrop's `arcology`) leans, then drops straight down
  groups: [Node C1, Node C2]
  warning: 1.5   # the lean (to the right, 0 -> 4 degrees)
  drop: 1.5      # straight down into itself: the impact at warning + drop = 3.0 s
  blast: {seconds: 1, from: 100, to: 390}   # the kills ride the dust blast's front: radius 100 -> 390 px round the foot, eased 1 - (1 - t)^2
  tower: arcology   # the band: this tower's 180 px footprint on the ground (placed once), however early or late the nodes die
  dust: {atmosphere: heavy, seconds: 6}   # in from 0.35 s before the impact, out over 6 s after it
  rubble: arcology-heap   # the rubble heap left at the foot (tools/art/collapse_l09.py)

secrets:
  - name: cocoon cache
    crate: 100   # Act 1 terms: pays 160 with the act factor
    radio: {speaker: Varga, line: "That cocoon was sitting on a CDF supply crate. Take it."}

pickups:
  - {pickup: special charge, dropped_by: {wave: 31, unit: last}}   # the last Stinger of the column ahead of the plaza's turret pair (only with a special fitted)
  - {pickup: overdrive, dropped_by: {wave: 76, unit: last}}        # the last Ravager of the tram pack

radio:  # trigger: t or event; requires: escort = only while Rook flies (hired, fitted and not ejected)
  - {t: 1, speaker: Okafor, line: "Six hive nodes in the arcology district. All six die, Lancer."}
  - {t: 8.5, speaker: Rook, requires: escort, line: "Six bugs, two pilots. I like those odds."}
  - {t: 24, speaker: Varga, line: "The nodes are hardened. Normal rounds just spark off them. Bombs, mortars or the Airstrike."}
  - {event: hold-start, speaker: Okafor, line: "Slowing you down over the plaza. Make it count.", notes: {trigger: "First hold starts (`hold-start`)"}}
  - {event: first-kill, enemy: hive-node, speaker: Rook, requires: escort, line: "One down. That's a horrible noise they make.", notes: {trigger: "First Hive Node destroyed"}}
  - {t: 58, speaker: Varga, line: "Fast movers on the ground, Lancer. Low, four legs. Hunting."}
  - {event: first-pounce, speaker: Rook, requires: escort, line: "It jumped at you! Since when do they jump?", notes: {trigger: "First pounce (`first-pounce`)"}}
  - {t: 95, speaker: Kilo Lead, portrait: generic-cdf, line: "Aegis, Kilo convoy on the Okonjo Bridge. Sixty civilians in the trucks, and things are coming over the far bank."}
  - {t: 107, speaker: Okafor, line: "Lancer, keep them off that bridge."}
  - {t: 140, speaker: Varga, line: "The arcology's frame is hollow with creep. Kill those last nodes and it may come down."}
  - {t: 152.5, speaker: The Choir, distorted: true, line: "[the Choir sings]"}
  - {event: collapse, speaker: Rook, requires: escort, line: "Timber. Somebody had to say it.", notes: {trigger: "Collapse starts (`collapse`)"}}
  - {event: level-end, speaker: Okafor, line: "All six nodes dead. The outer districts evacuate at first light, and you're flying cover.", notes: {trigger: Level end}}
  - {event: secondary-objective, speaker: Kilo Lead, portrait: generic-cdf, line: "Kilo convoy is across. Thank you, Aegis.", notes: {trigger: Secondary met}}
  - {event: mission-failed, speaker: Okafor, expression: grim, line: "{group} got past you, Lancer. If it lives, the district is lost.", notes: {trigger: "A node leaves the screen alive (the failed screen's line)"}}

objectives:
  primary: destroy-targets
  targets: [Node A1, Node A2, Node B1, Node B2, Node C1, Node C2]   # fails as soon as one leaves the screen alive
  secondary: {escapes: ravager, tag: bridge, name: Hold the bridge, credits: 63}   # every Ravager of the two bridge packs (63 in Act 1 terms: pays 101)

music:
  track: 7            # Act 2 B "Firestorm" (audio/music track list)
  start_section: 1    # the base stem from the launch
  full_section: 5
  stems: {5: base}    # the base stem through the whole level; the full mix only on the run-time events below
  full_on: [hold, collapse]   # the full mix in each hold (1 s in, 4 s out) and from the collapse to the end
  ambience: earth-megacity
  end_jingle: mission-complete

difficulty:  # the pincers' entries, the packs' sizes and the hard cluster C turrets are in their entries; the holds' speeds in `holds`; the stat blocks' hooks apply (hard: 3 Skitters per opening, pounces every 2 s)
  easy:
    extra_pickups:
      - {pickup: special charge, dropped_by: {wave: 116, unit: last}}   # the last Stinger over the bridgehead (only with a special fitted)

briefing:
  pages:
    - {speaker: Okafor, image: level-09-arcology-district, line: "Overnight the Vrell grew six hive nodes in the arcology district, Lancer: three clusters, A, B and C. Each one breeds swarmers, and their creep eats the towers. Destroy all six. Leave one alive and we lose the district."}
    - {speaker: Varga, image: level-09-node-scan, line: "The nodes are hardened: only bombs, mortars or the Airstrike crack them, Rook's mortar too. And something new hunts the streets in packs. Fast, low, and it leaps at you. Shoot it before it jumps."}
  teaser: {speaker: Rook, line: "Hardened nodes ahead, Lancer. Fit something that hits the ground, or fit me the mortar."}

backdrop:
  # Presentation only: the Nova Lagos arcology district in the last hour of the night (tools/art/
  # backdrop_l09.py, Level 08's production kit re-dressed; D9 = a). Towers are scenery in true
  # perspective; none leans over a ground target, its structure or a walker's path while on screen.
  # Motion budget: the fires (1) and the Kilo trucks (1), never together; the banks do not drift.
  scroll_factors: {deep: 0.12, far: 0.45, ground: 1, low-air: 1.35, high-air: 2}
  ramp: 4
  haze_colour: 2a2a3a  # cool grey-violet: the haze before dawn
  atmosphere:
    clear: {wisps: mist, haze: 0}   # section 2: thin mist only
    light: {banks: dust, wisps: mist, haze: 0.06}   # sections 1 and 3: street dust
    medium: {banks: smoke, wisps: ash, haze: 0.14}   # sections 4-5: river smoke, the towers' smoke, ash
    heavy: {banks: dust-heavy, wisps: ash, haze: 0.26}   # the collapse's dust (the event-triggered peak, ramping out over 6 s)
  tile_sets:
