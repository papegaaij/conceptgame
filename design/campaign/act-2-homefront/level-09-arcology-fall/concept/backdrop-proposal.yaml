# Level 09 backdrop PROPOSAL (tools/art/backdrop_l09.py --proposal; M5 part C batch, round 31).
# For the level-data step to merge into data.yaml: `backdrop` is the level's block, and the
# sections take the `tiles` below. Placements are SCRIPT time (scroll distance / 150 px/s): a hold
# slows the level clock with the scroll, so they wait with the ground; the trucks' `path` runs on
# the real clock from its first waypoint (D2 = a).
#
# sections[i].tiles (by section, in order):
#   Arcology Approach: [pre-dawn, approach]
#   Unity Plaza: [pre-dawn, plaza-district]
#   Boulevard Run: [pre-dawn, boulevard]
#   Okonjo Bridge: [pre-dawn, lagoon]
#   Arcology Fall: [pre-dawn, lobby-district]
#
# The ground targets this block was built round (t: entry at the top edge, x; the README's
# estimates; re-run --proposal and the images after moving a target):
#   plaza turrets (spine-turret, section 2): at [[34.6, 168], [34.6, 312]]
#   Node A1 (hive-node, section 2): at [[37.4, 150]]
#   Node A2 (hive-node, section 2): at [[38.2, 330]]
#   boulevard mortars (polyp-mortar, section 3): at [[67.6, 120], [68.8, 352]]
#   roof nest (spine-turret, section 3): at [[79.6, 340], [80.0, 390], [80.4, 440]]
#   creep cocoon (cocoon, section 3): at [[86, 118]]
#   quay mortars (polyp-mortar, section 4): at [[107.6, 48], [108.8, 84]]
#   bridgehead turrets (spine-turret, section 4): at [[116.2, 52], [116.2, 186]]
#   Node B1 (hive-node, section 4): at [[119.4, 64]]
#   Node B2 (hive-node, section 4): at [[120.2, 168]]
#   cluster C turrets (spine-turret, section 5): at [[161.6, 286], [161.6, 448]]
#   Node C1 (hive-node, section 5): at [[163.6, 318]]
#   Node C2 (hive-node, section 5): at [[164.4, 420]]
#
# The collapse (D5 = a): the arcology placement below is the tower that falls; the `collapse` block's
#   `rubble: arcology-rubble` (a piece, not placed: the collapse leaves it where the tower fell), and
#   `band` round the arcology's footprint (200 x 180 at x 100, its centre at ground position 25198,
#   so about 90 px above and below its centre's screen y when the fall starts). The look is round 31's
#   a/b (concept/collapse-r31-a, -b); rubble and the fall's art follow the pick.
# Kilo trucks: scenery on the ground layer (shots pass through), one piece so the motion budget
#   holds (trucks 1 + nothing else in section 4; fires only in sections 1, 3 and 5; no bank drifts).
# Walkers: every Creeper and Ravager path of the data keeps clear of the towers once --proposal is
#   re-run with the paths in data.yaml (the towers are placed against them, as Level 08's).

backdrop:
  # Presentation only: the Nova Lagos arcology district in the last hour of the night (tools/art/
  # backdrop_l09.py, Level 08's production kit re-dressed; D9 = a). Towers are scenery in true
  # perspective; none leans over a ground target, its structure or a walker's path while on screen.
  # Motion budget: the fires (1) and the Kilo trucks (1), never together; the banks do not drift.
  scroll_factors: {deep: 0.12, far: 0.45, ground: 1, low-air: 1.35, high-air: 2}
  ramp: 4
  haze_colour: 2a2a3a  # cool grey-violet: the haze before dawn
  atmosphere:
    clear: {wisps: mist, haze: 0}   # section 2: thin mist only
    light: {banks: dust, wisps: mist, haze: 0.06}   # sections 1 and 3: street dust
    medium: {banks: smoke, wisps: ash, haze: 0.14}   # sections 4-5: river smoke, the towers' smoke, ash
    heavy: {banks: dust-heavy, wisps: ash, haze: 0.26}   # the collapse's dust (the event-triggered peak, ramping out over 6 s)
  tile_sets:
    pre-dawn: {layer: deep, height: 480}   # the sky before dawn mirrored, grey in the east: seen only in the lagoon
    approach: {layer: ground, height: 960}   # 1: the ruined elevated highway (x 170-310), burnt-out traffic, blocks either side
    plaza-district: {layer: ground, height: 960}   # 2: avenues (x 112, 252), office roofs, parks
    boulevard: {layer: ground, height: 960}   # 3: the boulevard (x 170-290) with tram tracks, abandoned cars
    lagoon: {layer: ground, height: 960}   # 4: the lagoon (translucent), the west bank's quay, the Okonjo Bridge (x 220-300)
    lobby-district: {layer: ground, height: 960}   # 5: arcology podiums round the avenue (x 196-284), creep
    dust: {layer: low-air, height: 960}   # light: street dust, thin, lit grey from the east
    smoke: {layer: low-air, height: 960}   # medium: river smoke and the towers' smoke
    dust-heavy: {layer: low-air, height: 960}   # heavy: the collapse's dust (the event-triggered peak)
    mist: {layer: high-air, height: 960}   # clear and light: thin mist (additive), grey in the east
    ash: {layer: high-air, height: 960}   # medium and heavy: ash (additive)
