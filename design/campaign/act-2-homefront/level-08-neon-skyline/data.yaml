# Level 08 – Neon Skyline: the level script, rendered into README.md (briefing, threat profile,
# layout, waves, ground targets, radio, credit budget). Times are seconds from the level start.
# Schema: ../../../tech/architecture/README.md#data-file-schemas
scroll_speed: 140     # a calm-to-normal city pace, as in the chosen megacity scene
launch_seconds: 5     # flying in from the bottom edge with Rook in his slot, as in Act 1
bounty_scale: 0.56    # every bounty × 0.56: the typical haul on budget(8) (M5 part B, step B4)
control_prompts: []
prompts:  # contextual prompts in the HUD's prompt well: from t for seconds, the action and its keys
  - {t: 6, action: ROOK SIDE, keys: IN THE HANGAR, seconds: 6}   # "ROOK'S SIDE" runs 6 px past the prompt line
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: Earth megacity
  layers: [ground, air]
  density: 3
  traits: [anti-ground, forward]
  hazards: []
  boss: none
  varga:
    none: Nova Lagos at night, Lancer. Walkers in the streets, flyers over the towers. Lots of both.
    l1: Nearly all from ahead, two pincers from the flanks, nothing behind you. Smoke late on, but it stays below you.
    l2: "New one: the Creeper, a walker. It fans five shots at you every three seconds. Turrets and mortars sit on the low roofs."
    l3: "Anti-ground hits Creepers twice as hard. One cache: under the flickering billboard. Three hits bring it down."
  notes:
    Dominant layers: '`ground` (Creepers on the streets and low roofs, turret nests, mortars), `air`; `low-air` carries the traffic lanes (scenery, no enemies)'
    Attack directions: '{directions} by enemy count (two Needler pincers and the finale''s side stream)'
    Density: '{density}'
    Recommended traits: '{traits}'
    Hazards: none
    Boss / mid-boss: 'none (finale: Creeper convoy plus Needler circle)'
    Sensor-suite detail: 'none: Earth megacity at night, `ground` + `air`, front · L1: + directions, density {density}, no hazards · L2: + Skitter, Needler, Stinger, Creeper (new), Spine Turret and Polyp Mortar portraits; no boss · L3: + `anti-ground` highlighted, the wave strip marking the Creeper convoys at 84, 114, 128 and 162 s, 1 secret'

sections:  # back to back from t = 0; tiles: the backdrop's tile sets; peak: a heavier atmosphere inside the section
  - name: On the Wing
    end: 10
    atmosphere: light
    tiles: [gulf, harbour]
    notes:
      layers:
        deep: the night sky's glow on the Gulf of Guinea, seen in the harbour's water.
        ground: Lagos harbour, the water and its piers, a container ship at the pier, gantry cranes on the quay, container yards; the first elevated cross highway over the seam.
        low-air: amber-lit fog banks, CDF gunships heading home.
        high-air: thin mist.
      purpose: 'The launch with Rook in his slot from the start (he launches in formation and fires when the player fires); the HUD prompt `ROOK SIDE` · `IN THE HANGAR` at t=6 for 6 s. No enemies until the first Skitters at t=12.'
  - name: Traffic Lanes
    end: 65
    atmosphere: clear
    tiles: [gulf, avenues]
    notes:
      layers:
        ground: the harbour's last container yards, then two tree-lined avenues as lanes, low roofs, parks, the landing pad on a low roof; the first perspective towers rising along the avenues.
        low-air: streams of civilian aircars fleeing south (scenery; no searchlights, as the streams on the two avenues fill the motion budget), a CDF gunship pair.
        high-air: thin mist.
      purpose: Rook shoots what the player shoots; his first kill; the first turret nest.
  - name: Rooftop Crawl
    end: 115
    atmosphere: light
    tiles: [gulf, rooftops]
    notes:
      layers:
        ground: the boulevard and side streets with their lamp lines, blocks of low roofs, rooftop gardens, water tanks, the ramps and ledges the Creepers follow; perspective towers rising between them.
        low-air: thin fog banks lit amber by the avenue lamps; traffic thinning.
      purpose: 'Creeper introduction: one alone, then convoys. The billboard secret.'
  - name: Smoke District
    end: 160
    atmosphere: medium
    tiles: [gulf, rooftops]
    notes:
      layers:
        ground: burnt and burning blocks (the fire glow is on them and on the smoke's underside), a collapsed overpass, a parking deck.
        low-air: dense smoke columns (below the play plane).
        high-air: ash wisps (≤ 40% opacity).
      purpose: Mixed waves, Stinger dives, mortars on the overpass.
  - name: Neon Heights
    end: 200
    atmosphere: medium
    peak: {atmosphere: heavy, from: 166, to: 174}   # the smoke wall before the circle
    tiles: [gulf, third-mainland]
    notes:
      layers:
        ground: neon-lit low roofs and towers, neon signage under smoke (no saturated teal), the elevated Third Mainland highway carrying the finale convoy; at the level's end the Ndidi Arcology, a tower with creep on its roof and upper floors (the lead into L09).
        low-air: smoke banks.
      purpose: Finale set piece, then the level ends over the arcology district.

# The draft's Creeper beats with Skitter streams and snakes, Needler and Stinger groups of the
# level's own roster between them (user decision D5 = a of M5 part B: at least 50 a minute).
# Creeper paths: [x, y] points in screen coordinates at the unit's entry (y px below the top edge),
# scrolling with the ground; the Creepers walk north toward the Ikoyi shelters (up the screen, so
# the ground carries them down at 140 - 35 = 105 px/s and they leave by the bottom edge). A convoy's
# units enter 1.5 s apart on its one path, about 160 px apart on the screen.
waves:
  - {t: 12, formation: stream, enemy: skitter, count: 4, from: front, edge: right, interval: 1.5, notes: Over the harbour cranes; the first targets for Rook}
  - {t: 16, formation: stream, enemy: skitter, count: 4, from: front, edge: left, interval: 1.5}
  - {t: 20, formation: V-wing, enemy: needler, count: 4, from: front, notes: Over the container yards}
  - {t: 23, formation: snake, enemy: skitter, count: 6, from: front, edge: left, notes: Curls between the avenues}
  - {t: 27, formation: stream, enemy: skitter, count: 4, from: front, edge: right, interval: 1.25, notes: Over the aircar lanes}
  - {t: 32, formation: V-wing, enemy: needler, count: 5, from: front}
  - {t: 35.5, formation: snake, enemy: skitter, count: 6, from: front, edge: right, notes: Mirror of the t=23 snake}
  - {t: 39.5, formation: stream, enemy: skitter, count: 4, from: front, edge: left, interval: 1.25, notes: Over the first turret nest}
  - {t: 46, formation: column, enemy: stinger, count: 3, from: front}
  - {t: 49.5, formation: line abreast, enemy: needler, count: 3, from: front, notes: 'Hover over the highway, fire, leave'}
  - {t: 52.5, formation: stream, enemy: skitter, count: 4, from: front, edge: alternating, interval: 1.25}
  - {t: 58.5, formation: stream, enemy: skitter, count: 6, from: front, edge: alternating, interval: 1}
  - {t: 62.5, formation: V-wing, enemy: needler, count: 4, from: front, notes: Into the tower district}
  - {t: 66, formation: stream, enemy: skitter, count: 4, from: front, edge: right, interval: 1.25, notes: Away from the Creeper's side}
  - t: 68
    formation: single
    enemy: creeper
    count: 1
    from: front
    paths: [[[150, -40], [150, -140], [230, -230], [230, -700]]]   # along a low roof, down a ramp to the avenue
    notes: "**New.** Alone on a low roof, down a ramp to the avenue; Varga's line at t=66"
  - {t: 72, formation: line abreast, enemy: needler, count: 3, from: front}
  - {t: 76, formation: snake, enemy: skitter, count: 6, from: front, edge: left}
  - {t: 79.5, formation: stream, enemy: skitter, count: 4, from: front, edge: right, interval: 1.25}
  - t: 84
    formation: convoy
    enemy: creeper
    count: 3
    from: front
    paths: [[[330, -40], [330, -150], [260, -240], [260, -800]]]   # along the low roofs and down to the avenue
    easy: {count: 2}
    hard: {count: 4}
    notes: "Along the low roofs and down to the avenue, fans 0.5 s apart; Varga's anti-ground line; easy 2, hard 4"
  - {t: 88, formation: stream, enemy: skitter, count: 4, from: front, edge: alternating, interval: 1.25, notes: Over the second turret nest}
  - {t: 94, formation: pincer, enemy: needler, count: 4, from: sides, hold: 4, skip: [easy], notes: "2 per side, hold {hold} s; Rook's flank bark"}
  - {t: 94, formation: line abreast, enemy: needler, count: 4, from: front, skip: [medium, hard], notes: "Easy only: the pincer from the front"}
  - {t: 98, formation: snake, enemy: skitter, count: 6, from: front, edge: right, notes: Past the billboard}
  - {t: 101.5, formation: stream, enemy: skitter, count: 4, from: front, edge: alternating, interval: 1.25}
  - {t: 107, formation: V-wing, enemy: stinger, count: 3, from: front, notes: Dive one after another}
  - {t: 110.5, formation: stream, enemy: skitter, count: 4, from: front, edge: left, interval: 1.25, notes: Ahead of the walkers shelter nine reports}
  - t: 114
    formation: convoy
    enemy: creeper
    count: 3
    from: front
    paths: [[[110, -40], [110, -170], [190, -260], [190, -800]]]   # over the low roofs toward Ikoyi
    easy: {count: 3}
    hard: {count: 3}
    notes: "**Added** (D5): the walkers shelter nine reports, over the low roofs"
  - {t: 117.5, formation: V-wing, enemy: needler, count: 5, from: front, notes: Into the smoke}
  - {t: 121, formation: stream, enemy: skitter, count: 4, from: front, edge: right, interval: 1.25, notes: Over the parking-deck nest}
  - t: 128
    formation: convoy
    enemy: creeper
    count: 3
    from: front
    paths: [[[270, -40], [270, -120], [200, -220], [200, -800]]]   # through the burning blocks
    easy: {count: 3}
    hard: {count: 3}
    notes: Through the burning blocks
  - {t: 131.5, formation: stream, enemy: skitter, count: 4, from: front, edge: alternating, interval: 1.25}
  - {t: 134.5, formation: column, enemy: stinger, count: 3, from: front}
  - {t: 138, formation: snake, enemy: skitter, count: 6, from: front, edge: right, notes: Weaves through the smoke columns}
  - {t: 142, formation: pincer, enemy: needler, count: 4, from: sides, hold: 4, skip: [easy], notes: "2 per side; Rook's flank bark"}
  - {t: 142, formation: line abreast, enemy: needler, count: 4, from: front, skip: [medium, hard], notes: "Easy only: the pincer from the front"}
  - {t: 145.5, formation: column, enemy: stinger, count: 3, from: front, notes: The last one drops the armour patch}
  - {t: 149, formation: stream, enemy: skitter, count: 4, from: front, edge: left, interval: 1.25, notes: Over the overpass mortars}
  - {t: 156, formation: V-wing, enemy: needler, count: 4, from: front}
  - {t: 159.5, formation: stream, enemy: skitter, count: 4, from: front, edge: alternating, interval: 1.25, notes: Over the Third Mainland ahead of the convoy}
  - t: 162
    formation: convoy
    enemy: creeper
    count: 5
    from: front
    paths: [[[240, -40], [240, -900]]]   # straight up the elevated Third Mainland highway
    easy: {count: 5}
    hard: {count: 6}
    notes: "On the elevated highway; the first one drops an overdrive; hard 6"
  - {t: 165, formation: stream, enemy: skitter, count: 4, from: front, edge: right, interval: 1.25, notes: Into the smoke wall}
  - t: 170
    formation: circle
    enemy: needler
    count: 6
    from: front
    hold: 6         # s orbiting before the break
    break_group: 1  # Needlers that break toward the player together
    hard: {break_group: 2}
    notes: "Orbits above the highway for {hold} s, then breaks toward the player one by one (hard: in pairs)"
  - {t: 174, formation: stream, enemy: skitter, count: 6, from: sides, interval: 0.75, notes: Enters while the circle orbits}
  - {t: 181, formation: snake, enemy: skitter, count: 6, from: front, edge: left, notes: Past the arcology district; the last wave}

ground_targets:  # at: [t, x], when it enters at the top edge and its x
  - target: landing-pad nest
    section: 2
    enemy: spine-turret
    count: 3
    at: [[44, 300], [44.4, 360], [44.8, 420]]
    notes:
      target: '[Spine Turret](../../../enemies/ground/spine-turret/README.md) turret nest ×{count} on a landing pad on a low roof (t≈44)'
      effect: Bounty; first ground threat of the act
  - target: roof nest
    section: 3
    enemy: spine-turret
    count: 3
    at: [[88, 60], [88.4, 120], [88.8, 180]]
    notes:
      target: 'Spine Turret turret nest ×{count} on a low roof by the avenue (t≈88)'
      effect: Bounty
  - target: billboard
    section: 3
    layer: ground
    size: [72, 40]
    sprite: billboard
    hits: 3
    reveals: billboard cache
    at: [[100, 330]]   # on a low roof
    notes:
      target: Flickering billboard ("LAGOS NEVER SLEEPS") on a low roof (t≈100)
      effect: 'Takes 3 hits and topples; releases the hidden crate (secret, see below)'
  - target: parking-deck nest
    section: 4
    enemy: spine-turret
    count: 3
    at: [[124, 280], [124.4, 340], [124.8, 400]]
    notes:
      target: 'Spine Turret turret nest ×{count} on the parking deck (t≈124)'
      effect: Bounty
  - target: overpass mortars
    section: 4
    enemy: polyp-mortar
    count: 3
    at: [[150, 110], [150.5, 240], [151, 370]]
    notes:
      target: '[Polyp Mortar](../../../enemies/ground/polyp-mortar/README.md) ×{count} on the collapsed overpass (t≈150)'
      effect: Bounty; their impact markers teach "watch the ground" again
  - target: overpass turrets
    section: 4
    enemy: spine-turret
    count: 0
    at: []
    hard: {at: [[150.2, 175], [150.7, 305]]}
    notes:
      target: 'Spine Turrets between the overpass mortars (t≈150), none on easy and medium'
      effect: Bounty

secrets:
  - name: billboard cache
    crate: 100   # Act 1 terms: pays 160 with the act factor
    radio: {speaker: Rook, line: "Billboard's down, and there's a CDF crate under it. Grab it."}

pickups:
  - {pickup: overdrive, dropped_by: {wave: 162, unit: first}}      # the first Creeper of the highway convoy
  - {pickup: armour patch, dropped_by: {wave: 145.5, unit: last}}    # the last Stinger of the column

radio:  # trigger: t or event; {side} becomes Rook's side, left or right (two voiced takes)
  - {t: 1, speaker: Okafor, line: "Aegis, contacts inbound over the harbour. Weapons free."}
  - {t: 8.5, speaker: Rook, line: "Copy. Lancer, I'm on your {side}. Don't make me look bad."}
  - {event: escort-first-kill, speaker: Rook, line: "Splash one. I'm keeping count, by the way.", notes: {trigger: "Rook's first kill (`escort-first-kill`)"}}
  - {t: 26, speaker: Okafor, line: "The traffic below you is civilians getting out. Keep firing."}
  - {t: 43, speaker: Rook, line: "Turrets on that landing pad. Mind the thorns."}
  - {t: 66, speaker: Varga, line: "Walker on the low roofs. It sprays wide. Hit it hard."}
  - {t: 84, speaker: Varga, line: "Bombs and mortars hit those walkers twice as hard."}
  - {t: 113, speaker: Civilian, portrait: generic-civilian, line: "Shelter nine, Ikoyi! Walkers on the roofs, heading our way!"}
  - {t: 120.5, speaker: Okafor, line: "We hear you, shelter nine. Lancer, clear those roofs."}
  - {t: 157, speaker: Okafor, line: "Convoy on the Third Mainland. Keep it off the shelters."}
  - {t: 165, speaker: The Choir, distorted: true, line: "[the Choir sings]"}
  - {t: 171, speaker: Varga, line: "That's the song from orbit. It's louder down here."}
  - {event: level-end, speaker: Okafor, line: "Good flying, both of you. Get some rest. The arcologies are next.", notes: {trigger: Level end}}
  - {event: secondary-objective, speaker: Civilian, portrait: generic-civilian, line: "Shelter nine here. The roofs are quiet. Thank you, Aegis.", notes: {trigger: Secondary met}}

objectives:
  primary: reach-end
  secondary: {escapes: creeper, credits: 56}   # "No Creeper gets through": every Creeper destroyed before it leaves (56 in Act 1 terms: pays 90)

music:
  track: 6            # Act 2 A "Homefront" (audio/music track list)
  start_section: 2    # the base stem from the Traffic Lanes; section 1 has the ambience only
  full_section: 5     # the intensity stem from Neon Heights
  ambience: earth-megacity
  end_jingle: mission-complete

difficulty:  # the pincers' entries, the convoys' sizes, the circle's pairs and the hard overpass turrets are in their entries; the stat blocks' hooks apply
  easy:
    extra_pickups:
      - {pickup: armour patch, dropped_by: {wave: 131.5, unit: last}}   # t≈130

briefing:
  pages:
    - {speaker: Okafor, image: level-08-nova-lagos, line: "Nova Lagos has fought since dawn, Lancer: forty million people, and the Vrell among them. Fly low: harbour, highways, towers, then the Third Mainland to the Ikoyi shelters. First sortie with Rook on your wing. Bring each other home."}
    - {speaker: Varga, image: level-08-walker-scan, line: "The walkers are new. We call them Creepers. They crawl the streets and low roofs and fan their fire at you every few seconds. Anything that hits the ground hurts them twice as much. Every one you stop never reaches the shelters."}
  teaser: {speaker: Rook, line: "Escort slot's mine now, Lancer. Fit me a gun, and bring something that hits the ground."}

backdrop:
  # Presentation only: Nova Lagos at night (tools/art/backdrop_l08.py, from the chosen parallax r03 B).
  # Towers (D1 = a) are scenery drawn in true perspective; nothing the game plays with stands on one,
  # and none leans over a Creeper path, a ground target or its structure while on screen. Motion
  # budget: the gunships (1), the sedans and vans (2-3; sedans in the van lane while the CDF pair
  # crosses section 2), the smoke banks' drift and the fires (4-5).
  scroll_factors: {deep: 0.12, far: 0.45, ground: 1, low-air: 1.35, high-air: 2}
  ramp: 4
  haze_colour: 2c2434  # smoky violet-brown over the Gulf's glow
  atmosphere:
    clear: {wisps: mist, haze: 0}   # section 2: thin mist only
    light: {banks: fog, wisps: mist, haze: 0.06}   # sections 1 and 3: the amber-lit fog banks
    medium: {banks: smoke, wisps: ash, haze: 0.14}   # sections 4-5: smoke banks, ash
    heavy: {banks: smoke-heavy, wisps: ash, haze: 0.26}   # the smoke wall before the Needler circle
  tile_sets:
    gulf: {layer: deep, height: 480}   # the night sky's glow on the Gulf: seen only in the harbour's water
    harbour: {layer: ground, height: 960}   # 1: water (translucent), piers, the quay, container yards
    avenues: {layer: ground, height: 960}   # 2: two tree-lined avenues (x 112, 252) as the traffic lanes, low roofs, parks
    rooftops: {layer: ground, height: 960}   # 3-4: the boulevard (x 170-290), side streets, blocks of low roofs, gardens, tanks
    third-mainland: {layer: ground, height: 960}   # 5: the elevated Third Mainland highway (x 170-310), neon-lit low roofs
    fog: {layer: low-air, height: 960}   # light: r03's amber-lit fog banks
    smoke: {layer: low-air, height: 960, drift: 10}   # medium: smoke banks, lit orange from below
    smoke-heavy: {layer: low-air, height: 960, drift: 12}   # heavy: the smoke wall
    mist: {layer: high-air, height: 960}   # clear and light: thin mist (additive)
    ash: {layer: high-air, height: 960}   # medium and heavy: ash (additive)
  pieces:
    cross-highway: {layer: ground, size: [480, 92]}   # an elevated cross highway; one over every section seam
    quay-crane: {layer: ground, size: [170, 64]}   # a gantry crane on the quay, its boom over the water
    container-ship: {layer: ground, size: [100, 290], mid_size: true}   # moored at a pier, bow up
    container-yard: {layer: ground, size: [196, 260]}   # a container yard over a block at the harbour's edge
    burnt-block-a: {layer: ground, size: [72, 82]}   # a collapsed block (smoke district)
    burnt-block-b: {layer: ground, size: [76, 82]}
    burnt-block-c: {layer: ground, size: [94, 82]}
