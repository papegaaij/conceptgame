    neon-sign-b: {layer: ground, size: [60, 30]}
    neon-sign-c: {layer: ground, size: [60, 30]}
    smoke-column-a: {layer: low-air, size: [150, 200]}   # smoke plumes over the fires (static)
    smoke-column-b: {layer: low-air, size: [130, 180]}
    smoke-column-c: {layer: low-air, size: [170, 210]}
    aircar-sedan: {layer: low-air, size: [24, 24], headings: 16}   # civilian wedge sedan (round 30 a), slate; 16 headings, 0 nose up, clockwise
    aircar-van: {layer: low-air, size: [28, 28], headings: 16}   # civilian box van (round 30 a), beige
    gunship: {layer: low-air, size: [44, 44], headings: 16}   # CDF gunship (round 30 a), twin ducted fans
