radio:  # trigger: t or event; the "six" lines start with the bottom-edge warning of the rear strike they call
  - {t: 2, speaker: Okafor, line: "Aegis, Daedalus Rim stopped answering thirty hours ago. Find out why."}
  - {t: 12.5, speaker: Rook, line: "Aegis Two on the north lane. I've got cousins on Daedalus, Lancer."}
  - {t: 20, speaker: Varga, line: "You're over the terminator. Headlight on. The Vrell glow; the ground doesn't. Trust the glow."}
  - {t: 32.5, speaker: Rook, line: "Something on your left edge. It's just... sitting there.", notes: {trigger: the first Mantis's warning}}
  - {t: 40, speaker: Varga, line: "It's a sniper. It holds at the edge and sweeps a beam across you. Get an angle on it, or get away from that side."}
  - {t: 52.5, speaker: Perimeter beacon, portrait: generic-cdf, line: "...Daedalus perimeter. All residents report to shelter... all residents report..."}
  - {t: 64, speaker: Okafor, expression: grim, line: "Domes intact. Airlocks open. Nobody's home."}
  - {t: 76, speaker: Varga, line: "Long contact, moving like a snake. Cut it and the back half grows a new head. Go for the head."}
  - {t: 112, speaker: Rook, shout: true, line: "It's turning, it's coming round behind you! Six, Lancer, six!", notes: {trigger: the t=102 loop-back's warning}}
  - {t: 119.5, speaker: Varga, line: "You can't shoot behind you yet. Dodge it."}
  - {t: 131, speaker: Rook, shout: true, line: "Contacts on six! Why is it always six?", notes: {trigger: the t=134 rear entry's warning}}
  - {t: 160, speaker: Varga, expression: grim, line: "No bodies. No damage. Commander, the Vrell didn't kill them. They took them."}
  - {t: 171, speaker: Okafor, expression: grim, line: "...Understood. Log it, Varga. Aegis, finish this and come home."}
  - {t: 180.5, speaker: Rook, line: "Another one's coming round. Watch your tail.", notes: {trigger: the t=168 loop-back's warning}}
  - {event: level-end, speaker: Okafor, expression: grim, line: "Daedalus is empty. So are the others. We'll find them.", notes: {trigger: Level end}}
  - {event: level-end, speaker: Rook, line: "...Copy. Aegis Two, heading home.", notes: {trigger: "Level end, after Okafor's line"}}
  - {event: secondary-objective, speaker: Okafor, line: "Not one sniper left standing. Good eyes in the dark, Lancer.", notes: {trigger: Secondary met}}

objectives:
  primary: reach-end
  secondary: {escapes: mantis, credits: 50}   # "Clear the edges": every Mantis destroyed before it leaves

music:
  track: 5            # Act 1 B "Coalition Rising" (audio/music track list)
  start_section: 1    # the base stem: the far side is sparse and tense
  full_section: 4     # the intensity stem from the Vrell Fields
  ambience: luna
  ambience_from: 186  # the theme fades out: ambience only for the last seconds, after the Varga/Okafor exchange
  voice_loop: {speaker: Perimeter beacon, section: 2, db: -18}   # the beacon's radio line, looping faintly under section 2
  end_jingle: mission-complete

difficulty: {}   # the Coilwyrm warnings and the hard pair are in their waves, the t=112 flare in the darkness; the stat blocks' hooks apply

briefing:
  pages:
    - {speaker: Okafor, image: level-06-daedalus-rim, line: "Lancer, three farside settlements stopped answering in the last thirty hours. Daedalus Rim is the largest: two thousand people, mostly miners and their families. No distress call, no wreckage, just silence. You'll cross the terminator into full dark. Your headlight and whatever the settlement still has lit are all you'll see by. Find out what happened. If the Vrell are still there, make them leave."}
    - {speaker: Varga, image: level-06-edge-scan, line: "Two new contacts. A sniper that sits at the edges of your screen, so guns that fire sideways will help. And something long that moves like a serpent and likes to come round behind you. Your rear is open, Lancer. Don't fight it there. Move."}
  teaser: {speaker: Varga, line: "Farside is dark, and they're holding at the edges. Something that shoots sideways would earn its keep."}

# Far side (tools/art/backdrop_l06.py, round 23): Level 04's top-down kit, no deep layer, one shared
# terrain and palette for the ground tiles, the ore rail at x 410 in every ground tile set. The ground
# images are the regolith as a lamp shows it; the runtime light map (darkness) darkens it.
backdrop:
  scroll_factors: {far: 0.85, ground: 1.0, low-air: 1.35, high-air: 2.2}
  ramp: 2
  haze_colour: 0c0e16
  atmosphere:
    clear: {haze: 0.2}
    light: {banks: plumes-light, haze: 0.25}
    medium: {banks: plumes-medium, haze: 0.3}
    heavy: {banks: plumes-heavy, haze: 0.4}      # the collapsing dome's dust (140-146 s)
  tile_sets:
    terminator: {layer: ground, height: 960}     # section 1: big craters, their rims catch the last sun
    dome-field: {layer: ground, height: 960}     # sections 2 and 5: settlement regolith, low relief
    array-field: {layer: ground, height: 960}    # section 3: cratered regolith round the dishes
    vrell-field: {layer: ground, height: 960}    # section 4: teal Vrell roots
    plumes-light: {layer: low-air, height: 960, drift: 6}     # darkened (the low-air layer is not)
    plumes-medium: {layer: low-air, height: 960, drift: 8}
    plumes-heavy: {layer: low-air, height: 960, drift: 10}
    ejecta-streaks: {layer: high-air, height: 960}
  pieces:
    dome-a: {layer: ground, size: [180, 150], mid_size: true}   # mining domes, windows lit, airlocks open
    dome-b: {layer: ground, size: [170, 140], mid_size: true}   # two domes, a walkway, a dish
    dome-c: {layer: ground, size: [150, 140], mid_size: true}   # a big dome, two open airlocks
    dome-overgrown: {layer: ground, size: [170, 150], mid_size: true}   # a dome under Vrell growth
    dome-broken: {layer: ground, size: [170, 150], mid_size: true}   # the collapsed dome (heavy peak)
    nest-a: {layer: ground, size: [240, 220], mid_size: true}   # Vrell nest, teal well, luminous tendrils
    nest-b: {layer: ground, size: [220, 200], mid_size: true}   # a smaller nest
    dish-big: {layer: ground, size: [140, 140], mid_size: true}   # the observatory's big dish
    dish-array: {layer: ground, size: [280, 120], mid_size: true}   # three dishes, cable trench, control hut
    dark-crater: {layer: ground, size: [200, 200], mid_size: true}   # the survey cache's crater, cut from the terrain
    landing-pad: {layer: ground, size: [240, 240], mid_size: true}   # the empty landing pad (Level 04's)
    daedalus-gate: {layer: ground, size: [480, 280], mid_size: true}   # the pressure wall, the main airlock open, the freight lock over the rail
    rail-lamp: {layer: ground, size: [24, 24]}   # lamp mast beside the rail (its pool is a darkness light)
    boulder: {layer: ground, size: [64, 56]}
    boulder-growth-a: {layer: ground, size: [72, 64]}   # a Vrell socket on top: a turret's base
    boulder-growth-b: {layer: ground, size: [72, 64]}
  placed:
    # 1. Terminator: the sunlit crater rims
    - {piece: boulder, t: 7, x: 120}
    - {piece: boulder, t: 19, x: 300}
    # 2. Silent Domes: domes, the ore rail's lamps, the turrets' sockets between domes
    - {piece: rail-lamp, t: 27, x: 384}
    - {piece: dome-a, t: 31, x: 120}
    - {piece: rail-lamp, t: 33, x: 384}
