# Level 06 – Farside: the level script, rendered into README.md (briefing, threat profile, layout,
# waves, ground targets, radio, credit budget). Times are seconds from the level start.
# Schema: ../../../tech/architecture/README.md#data-file-schemas
scroll_speed: 130     # calm, so the dark stays readable
launch_seconds: 5     # flying in from the bottom edge, as in Levels 01-05
bounty_scale: 0.75    # every bounty × 0.75: the typical haul on budget(6) (user decision D1)
control_prompts: []
prompts: []
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: Luna
  layers: [air, ground]
  density: 3
  traits: [side, spread]
  hazards: [darkness]
  boss: none
  varga:
    none: The far side is dark, Lancer. Snipers at the edges, and something long that comes round behind you.
  notes:
    Dominant layers: '`air`, `ground` (turrets and mortars, seen only by their glow)'
    Attack directions: '{directions} by enemy count (the Skitter streams come from the front); by threat **the sides and rear**: 8 Mantis at the edges, and every Coilwyrm but the first strikes from the bottom edge (two loop-backs, one rear entry)'
    Density: '{density}'
    Recommended traits: '{traits} (`homing` from the Micro-missile Pod helps against the edges)'
    Hazards: 'Darkness: the ground visible only in light pools; no rear-firing weapon available yet'
    Boss / mid-boss: '{boss}'
    Sensor-suite detail: 'none: Luna far side, `air` + `ground`, front · L1: + directions with the rear warning, density {density}, hazard "darkness" · L2: + Mantis, Coilwyrm, Needler, Stinger, Skitter, Spine Turret, Polyp Mortar portraits; Smart Bomb available · L3: + `side` highlighted, wave strip, 1 secret + 1 data core'

sections:  # back to back from t = 0; tiles: the backdrop's tile sets (no deep layer on Luna); peak: a heavier atmosphere inside the section
  - name: Terminator
    end: 25
    atmosphere: clear
    tiles: [terminator]
    notes:
      layers:
        ground: 'the last sunlit crater rims sliding into black (no `deep` layer on Luna, so no Milky Way and no Earth: it never rises on the far side); the headlight cone switches on at t=22.'
      purpose: Into the dark; the headlight.
  - name: Silent Domes
    end: 70
    atmosphere: clear
    tiles: [dome-field]
    notes:
      layers:
        ground: Daedalus Rim's outer domes, lights on, airlocks open; the ore rail with lamp posts.
        low-air: none.
      purpose: First Mantis alone; edges matter.
  - name: Observatory Array
    end: 110
    atmosphere: light
    tiles: [array-field, ejecta-streaks]
    notes:
      layers:
        ground: radio-silent dish arrays, a dark crater (the secret).
        low-air: faint regolith plumes.
      purpose: First Coilwyrm (no loop), then the first loop-back. Flare at t=70.
  - name: Vrell Fields
    end: 160
    atmosphere: medium
    peak: {atmosphere: heavy, from: 140, to: 146}   # a collapsing dome's dust cloud
    tiles: [vrell-field]
    notes:
      layers:
        ground: teal nest growth with branching luminous tendrils spreading between domes.
        low-air: regolith plumes; a collapsing dome's dust cloud (the heavy peak).
      purpose: Mantis pincers with Coilwyrms; turrets known only by their glow. Flares at t=112 and t=150.
  - name: Daedalus Gate
    end: 190
    atmosphere: light
    tiles: [dome-field]
    notes:
      layers:
        ground: the settlement's main airlock, wide open and lit; the empty landing pad.
      purpose: Final Coilwyrm and Mantis pincer; the data core.

# The Mantis and Coilwyrm beats as in the first draft; Skitter streams and snakes, Needler and
# Stinger groups of this level's roster between them (user decision D1: at least 40 a minute, no
# generic filler). Coilwyrm paths: [x, y] points, y px below the top edge; a loop-back's path is
# shifted sideways to start at the head's x when it re-enters from the bottom edge.
