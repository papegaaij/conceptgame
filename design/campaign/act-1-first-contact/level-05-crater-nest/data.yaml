boss:  # the mid-boss arrives at a fixed time, after battery D (user decision D2)
  enemy: gorgon-frigate
  t: 150
  x: 240
  section: 5
  notes:
    waves: Fixed time, after battery D. Skitter streams of 6 at the settle and every 10 s in phase 1 (2 streams at medium par)
    streams: 2   # the streams of a fight at par, which the credit budget counts

sleds:  # the mass-driver sleds on Level 04's rail (user decision; design/world/luna, hazards)
  x: 432
  width: 24
  first: 16.5      # after Driver Control's warning; the t=28 mortar enters between the sleds of 26.5 and 31.5 s
  period: 5
  until: 35
  lights: 1.5
  run: 0.4
  damage: 15
  clamp: stuck sled
  easy: {period: 8}
  hard: {period: 4}

rocks:  # low-gravity debris from destroyed ground units (sections 2-4; the first mortar is alone on the rail)
  count: [2, 3]
  speed: [40, 60]
  life: 2.5
  size: [16, 16]
  hp: 1
  damage: 6
  clearance: 72

secrets:
  - name: stuck sled
    crate: 65
    radio: {speaker: Rook, line: "That canister sat jammed on the rail all week. Finders keepers, Lancer."}

pickups:
  - {pickup: overdrive, dropped_by: {wave: 95, unit: first}}             # the Brood Pod of the t=95 group, if killed before it bursts
  - {pickup: armour patch, dropped_by: {group: Battery C, unit: last}}   # whichever unit of battery C dies last

radio:  # trigger: t or event; {group} becomes the battery's name; shout: true = the voice shouts it
  - {t: 1, speaker: Okafor, line: "There's the crater, Aegis. Four batteries on the floor. All four die, or this was for nothing."}
  - {t: 12.5, speaker: Driver Control, portrait: generic-cdf, line: "Mass driver's still on automatic, Aegis. Sleds every five seconds. Watch the rail lights."}
  - {t: 27, speaker: Varga, line: "That one lobs acid. It marks where it'll land, a second ahead. Don't be there.", notes: {trigger: first mortar}}
  - {t: 46, speaker: Rook, expression: fierce, shout: true, line: "Aegis Two here. Two groups, both flanks of you, Lancer!", notes: {trigger: pincer}}
  - {event: group-cleared, group: Battery A, speaker: Okafor, line: "Battery down."}
  - {event: group-cleared, group: Battery B, speaker: Okafor, line: "Two."}
  - {event: group-cleared, group: Battery C, speaker: Okafor, line: "Three. One left."}
  - {event: group-cleared, group: Battery D, speaker: Okafor, line: "That's the last battery. The nest is open."}
  - {event: mission-failed, speaker: Okafor, expression: grim, line: "{group} is behind you. The nest survives. Pull back, Lancer.", notes: {trigger: "Battery passes alive (the failed screen's line)"}}
  - {t: 116.5, speaker: Driver Control, portrait: generic-cdf, line: "The nest is venting. Dust everywhere. Your scopes will clear in a few seconds."}
  - {t: 144.5, speaker: The Choir, distorted: true, line: "[the Choir sings]"}
  - {t: 150.5, speaker: Driver Control, portrait: generic-cdf, shout: true, line: "Big contact dropping out of orbit, right on top of the crater!"}
  - {t: 158, speaker: Varga, line: "A warship. Three heads, all guns. Take the heads one at a time; then the crown opens. Hit the core.", notes: {trigger: the frigate settles}}
  - {t: 170, speaker: Rook, line: "Oh, it has *heads*. Of course it has heads.", notes: {trigger: after the first stream}}
  - {event: boss-phase, phase: Core, speaker: Varga, expression: fierce, line: "Crown's opening. That's the core. Lime glow, Lancer!", notes: {trigger: Last head destroyed}}
  - {event: boss-destroyed, speaker: Okafor, line: "Frigate down. The nest is dead. Get out of there, Aegis.", notes: {trigger: Frigate destroyed}}
  - {event: level-end, speaker: Okafor, line: "Good work. Varga wants samples. I told her no.", notes: {trigger: Level end}}
  - {event: secondary-objective, speaker: Varga, line: "Every growth in that crater burned. We'll have nothing to study. Well done, I suppose.", notes: {trigger: Secondary met}}

objectives:
  primary: destroy-targets
  targets: [Battery A, Battery B, Battery C, Battery D]   # fails as soon as a unit of one leaves the screen alive
  secondary: {kill_all: [polyp-mortar, spine-turret], label: NEST, credits: 40}   # "Scorched crater"

music:
  track: 4            # Act 1 A "Afterburner"
  start_section: 1
  full_section: 2     # the intensity stem from the crater rim, where battery A comes
  ambience: luna
  end_jingle: mission-complete
  boss_sting: miniboss-sting   # track 21 over a 0.5 s crossfade at the frigate's arrival, then the track again

difficulty: {}   # the batteries' sizes are in their placements; the sleds' periods in `sleds`; the stat blocks' hooks apply

briefing:
  pages:
    - {speaker: Okafor, image: level-05-crater-nest, line: "Lancer, the pods at Tranquility weren't random. Survey drones found where they came from: a crater beside the mass-driver line, and the Vrell are growing a nest in it. Four batteries of acid-throwers and turrets guard the floor. Destroy all four. If a battery is still alive when you pass it, the nest survives and the mission fails. There's no second run at that crater today. And stay clear of the rail. The mass driver is still firing on automatic."}
    - {speaker: Varga, image: level-05-mortar-scan, line: "The acid-throwers mark their target a second before it lands. Keep moving and you'll be fine. And something in orbit keeps watching that crater. I don't like it."}
  teaser: {speaker: Varga, line: "Turrets, mortars and a lot of ground to cover. Bring something that hits the surface, and something wide for the flanks."}

