# Level 05 – Crater Nest: the level script, rendered into README.md (briefing, threat profile,
# layout, waves, ground targets, radio, credit budget). Times are seconds from the level start;
# after t = 150 they run on the arena's pausable clock (see the README's Arena clock).
# Schema: ../../../tech/architecture/README.md#data-file-schemas
# No Level 05 art exists yet: the backdrop reuses Level 04's Luna images (backdrop.images) until the
# part's production round.
scroll_speed: 150
launch_seconds: 5     # flying in from the bottom edge, as in Levels 01-04
control_prompts: []
prompts:  # contextual prompts in the HUD's prompt well; requires: special = only with a special fitted
  - {t: 156, action: SPECIAL, keys: CALL HAMMER, seconds: 6, requires: special}
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: Luna
  layers: [ground, air]
  density: 3
  traits: [anti-ground, spread]
  hazards: [sleds, debris]
  boss: Gorgon Frigate
  objective: DESTROY 4 BATTERIES   # the OBJECTIVE field from sensor L1
  varga:
    none: Acid mortars and turrets on a crater floor, Lancer. Something in orbit is watching.
  notes:
    Dominant layers: '`ground` (mortars, turrets, the batteries), `air`'
    Attack directions: '{directions}'
    Density: '{density}'
    Recommended traits: '{traits}'
    Hazards: Mass-driver sleds (section 1); low-gravity debris from destroyed ground targets
    Boss / mid-boss: 'Mid-boss: {boss}'
    Sensor-suite detail: 'none: Luna, `ground` + `air`, front · L1: + directions, density {density}, hazards "sleds, debris", OBJECTIVE `{objective}` · L2: + Needler, Skitter, Stinger, Brood Pod portraits; mid-boss name and silhouette · L3: + `anti-ground` highlighted, wave strip, 1 secret'

sections:  # back to back from t = 0; tiles: the backdrop's tile sets (no deep layer on Luna); peak: a heavier atmosphere inside the section
  - name: Mass-Driver Line
    end: 35
    atmosphere: clear
    tiles: [mass-driver-field]
    notes:
      layers:
        ground: 'regolith, the mass-driver rail at x 432 (Level 04''s rail), its signal lights, the launch sleds streaking up the rail.'
      purpose: Learn the sled rhythm; the first Polyp Mortar alone.
  - name: Crater Rim
    end: 75
    atmosphere: light
    tiles: [mare-b]
    notes:
      layers:
        ground: the outer rim and its inner walls (ground pieces), boulders, an abandoned rover.
        low-air: regolith plumes from mortar impacts.
      purpose: Battery A; side waves.
  - name: Nest Floor
    end: 125
    atmosphere: medium
    peak: {atmosphere: heavy, from: 115, to: 122}   # the nest venting spore dust
    tiles: [crater-growth, ejecta-streaks]
    notes:
      layers:
        ground: the crater floor with teal Vrell growth and pod husks.
        low-air: spore dust venting from the nest (the heavy peak).
        high-air: ejected rock streaks.
      purpose: Batteries B and C; Brood Pods; low-gravity debris.
  - name: Nest Heart
    end: 150
    atmosphere: light
    tiles: [crater-growth]
    notes:
      layers:
        ground: the central growth, pod husks around battery D.
        low-air: thin plumes.
      purpose: Battery D; the frigate's shadow falls over the floor.
  - name: Gorgon Frigate
    end: 205
    speed: 30
    arena: true
    atmosphere: clear
    tiles: [crater-growth]
    notes:
      layers:
        ground: the nest heart below (no terrain collision).
        air: the frigate, its bell in the upper third.
      purpose: Mid-boss fight (≈ 55 s at medium); the scroll halts after 55 s while the frigate lives, and section 6 starts at its death.
  - name: Lift-off
    end: 215
    atmosphere: light
    tiles: [mare-a]
    notes:
      layers:
        ground: the far rim, the burning nest behind.
      purpose: Credit shower, end.

