    - {piece: road-bridge-arches, t: 106.4, x: 255, overhead: true}   # over the convoy, under the turrets
    - {piece: rille-end-north, t: 112.15, x: 275}
    # 4. Landing Zone: pod husks (the t=145 nest among them)
    - {piece: pod-husk-a, t: 117, x: 110}
    - {piece: pod-husk-b, t: 124, x: 380}
    - {piece: boulder, t: 129, x: 100}
    - {piece: pod-husk-a, t: 135, x: 110}
