# Level 04 – Tranquility Run: the level script, rendered into README.md (briefing, threat profile,
# layout, waves, ground targets, radio, credit budget). Times are seconds from the level start.
# Schema: ../../../tech/architecture/README.md#data-file-schemas
# The `backdrop` and `road` blocks and the sections' tiles are merged in from the round 17
# backdrop proposal (art: tools/art/backdrop_l04.py, which reads them from here).
scroll_speed: 120     # px/s: the crawlers' pace
launch_seconds: 5     # flying in from the bottom edge, as in Levels 01-03
control_prompts: []
prompts:  # contextual prompts in the HUD's prompt well; requires: special = only with a special fitted
  - {t: 75, action: SPECIAL, keys: CALL HAMMER, seconds: 6, requires: special}
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: Luna
  layers: [ground, air]
  density: 2
  traits: [forward, anti-ground]
  hazards: []
  boss: none
  objective: ESCORT 5 CRAWLERS   # the OBJECTIVE field from sensor L1
  varga:
    none: Walkers in the craters and egg sacs coming down, Lancer. And five crawlers that can't dodge.
  notes:
    Dominant layers: '`ground` (turrets, walkers, the convoy), `air`'
    Attack directions: '{directions} (walker pincers over the crater rims)'
    Density: '{density}'
    Recommended traits: '{traits}'
    Hazards: none lethal; ground fire targets the convoy
    Boss / mid-boss: '{boss}'
    Sensor-suite detail: 'none: Luna, `ground` + `air`, front · L1: + directions, density {density}, OBJECTIVE `{objective}` · L2: + Brood Pod, Scuttler, Spine Turret, Needler, Skitter portraits; Airstrike available · L3: + `anti-ground` highlighted, wave strip, 1 secret'

sections:  # back to back from t = 0; tiles: the backdrop's tile sets (no deep layer on Luna); peak: a heavier atmosphere inside the section
  - name: Tranquility Base
    end: 25
    atmosphere: clear
    tiles: [mare-a]
    notes:
      layers:
        ground: 'Tranquility Base: domes, the Apollo 11 heritage dome, the convoy assembling and pulling out, earthshine-tinted crater shadows.'
        low-air: none.
      purpose: First planetary surface; the convoy forms up; the first Brood Pod alone.
  - name: Mare Road
    end: 70
    atmosphere: light
    tiles: [mare-b, rille-floor]
    notes:
      layers:
        ground: the convoy road across grey mare, abandoned rovers, turret growth on boulders.
        low-air: thin regolith plumes from impacts.
      purpose: Protect the convoy from turrets; pods with escorts.
  - name: Rille Crossing
    end: 110
    atmosphere: medium
    tiles: [rille-rims, rille-floor]
    notes:
      layers:
        far: the floor of a sinuous rille (40% haze).
        ground: the rille rim and a road bridge across it.
        low-air: dust kicked up by the walkers.
      purpose: The first walker, alone on the rille rim; then pairs.
  - name: Landing Zone
    end: 155
    atmosphere: medium
    peak: {atmosphere: heavy, from: 130, to: 137}   # the pod lander's impact plume
    tiles: [crater-growth, ejecta-streaks]
    notes:
      layers:
        ground: craters with split pod husks and the first teal Vrell growth.
        low-air: a regolith plume from a pod lander impact (the heavy peak).
        high-air: ejected rock streaks.
      purpose: Walker pincer and pods together; the hidden cache.
  - name: Terminal Gate
    end: 190
    atmosphere: light
    tiles: [mass-driver-field]
    notes:
      layers:
        ground: "the mass-driver rail with sleds launching to orbit (scenery), the terminal's vehicle hangar (380×300 px) with its lit door, landing lights on its apron, the road ending inside it."
      purpose: Final pods and walker; the convoy drives into the hangar.

waves:  # paths: a walker wave's ground paths, one list of [x, y] points per unit (y below the top edge at the wave's t; they scroll with the ground)
  - {t: 7, formation: stream, enemy: skitter, count: 3, from: front, edge: left, interval: 2, easy: {count: 3}, hard: {count: 3}, notes: Pacing filler}
  - {t: 13.5, formation: stream, enemy: skitter, count: 4, from: front, edge: right, interval: 2, easy: {count: 4}, hard: {count: 4}, notes: Pacing filler}
  - {t: 22, formation: single, enemy: brood-pod, count: 1, from: front, notes: "**Introduction**: alone, above the base; bursts into 6 Skitters"}
  - {t: 27.5, formation: stream, enemy: skitter, count: 3, from: front, edge: alternating, interval: 2, easy: {count: 3}, hard: {count: 3}, notes: Pacing filler}
  - {t: 32, formation: snake, enemy: skitter, count: 6, from: front, edge: left}
  - {t: 35.5, formation: stream, enemy: skitter, count: 3, from: front, edge: alternating, interval: 2, easy: {count: 3}, hard: {count: 3}, notes: Pacing filler}
  - t: 45
    groups:
      - {formation: carrier + escorts, enemy: brood-pod, count: 1}
      - {formation: carrier + escorts, enemy: needler, count: 3}
    from: front
    notes: Needlers `orbit` the pod
  - {t: 51.5, formation: stream, enemy: skitter, count: 4, from: front, edge: left, interval: 2, easy: {count: 4}, hard: {count: 4}, notes: Pacing filler}
  - {t: 60, formation: V-wing, enemy: needler, count: 3, from: front, notes: Over a turret nest}
  - {t: 66.5, formation: stream, enemy: skitter, count: 3, from: front, edge: right, interval: 2.75, easy: {count: 3}, hard: {count: 3}, notes: Pacing filler}
  - t: 75
    formation: single
    enemy: scuttler
    count: 1
    from: front
    paths: [[[200, -40], [200, 10], [130, 40], [70, -30]]]   # down the rille's west rim, across the road, then away north-west
    notes: '**Introduction**: walks along the rille rim on the ground layer beside the road, then turns toward the column, showing its back as it turns'
  - {t: 80, formation: stream, enemy: skitter, count: 3, from: front, edge: alternating, interval: 2.5, easy: {count: 3}, hard: {count: 3}, notes: Pacing filler}
  - t: 88
    formation: pincer
    enemy: scuttler
    count: 2
    from: sides
    paths:
      - [[-40, 0], [50, 40], [170, -20]]     # over the west rim and across the road
      - [[520, 20], [420, 30], [350, -60]]   # over the east rim, up beside the rille
    notes: Walk in over both crater rims toward the convoy; edge warnings
  - {t: 95, formation: stream, enemy: skitter, count: 9, from: front, edge: alternating, interval: 0.5, notes: While the pincer walks in}
  - {t: 100, formation: single, enemy: brood-pod, count: 1, from: front}
  - {t: 107.5, formation: stream, enemy: skitter, count: 3, from: front, edge: alternating, interval: 2, easy: {count: 3}, hard: {count: 3}, notes: Pacing filler}
  - t: 115
    groups:
      - {formation: carrier + escorts, enemy: brood-pod, count: 1}
      - {formation: carrier + escorts, enemy: needler, count: 3}
    from: front
  - t: 120
    formation: convoy
    enemy: scuttler
    count: 2
    from: front
    paths: [[[265, -40], [276, 200], [289, 320], [322, 600]]]   # down the road (its ground positions at t=120), 1.5 s apart
    notes: Walk down the road toward the column, claws first
  - {t: 127.5, formation: stream, enemy: skitter, count: 3, from: front, edge: left, interval: 2, easy: {count: 3}, hard: {count: 3}, notes: Pacing filler}
  - {t: 133.5, formation: stream, enemy: skitter, count: 3, from: front, edge: right, interval: 2, easy: {count: 3}, hard: {count: 3}, notes: Pacing filler}
  - t: 140
    formation: pincer
    enemy: scuttler
    count: 2
    from: sides
    paths: [[[-40, 40], [70, 70], [200, -10]]]   # mirrored for the unit from the right
    hard: {count: 4}
    notes: Out of the heavy dust; edge warnings; two per side on hard
  - {t: 150, formation: line abreast, enemy: brood-pod, count: 2, from: front}
  - {t: 160, formation: line abreast, enemy: needler, count: 3, from: front}
  - {t: 163, formation: stream, enemy: skitter, count: 3, from: front, edge: alternating, interval: 2, easy: {count: 3}, hard: {count: 3}, notes: Pacing filler}
  - t: 165
    formation: single
    enemy: scuttler
    count: 1
    from: front
    paths: [[[300, -40], [255, 110], [180, 250]]]   # out of the gate yard, across the road
    notes: Comes out of the gate yard toward the convoy

ground_targets:  # at: [t, x], when it enters at the top edge (2.25 s before its base piece's centre passes the screen middle) and its x
  - target: Mare Road nest
    section: 2
    enemy: spine-turret
    count: 3
    at: [[39.48, 173], [40.28, 339], [41.08, 161]]   # on the boulder-growth sockets at 41.8 / 42.6 / 43.4 s
    notes:
      target: 'Turret nest: Spine Turret ×{count} by the road (t≈40)'
      effect: Fires at the player and the convoy
  - target: supply drop
    section: 2
    layer: ground
    size: [32, 24]
    sprite: supply-drop   # assets/sprites/supply-drop_0..2, -break_0..7 (tools/art/l04_targets.py)
    hp: 3
    drop: medium salvage
    bonus_drop: special charge
    at: [[52.5, 330]]    # beside the road; passes the screen middle at about 54.9 s
    notes:
      target: CDF supply drop (ground layer, {hp} HP; t≈55)
      effect: 'Medium salvage ({drop_credits}); also a special charge if a special is fitted (on top of the free first Airstrike charge)'
      budget: supply drop {drop} {drop_credits}

  - target: boulder nest
    section: 2
    enemy: spine-turret
    count: 4
    at: [[61.08, 293], [61.68, 93], [62.48, 323], [63.08, 97]]   # sockets at 63.4 / 64.0 / 64.8 / 65.4 s
    notes:
      target: 'Turret nest: Spine Turret ×{count} on boulders (t≈62)'
      effect: As above
  - target: bridge abutments
    section: 3
    enemy: spine-turret
    count: 2
    at: [[103.35, 202], [104.95, 308]]   # on the road bridge's two arches, over the road
    notes:
      target: Spine Turret ×{count} on the bridge arches over the road (t≈105)
      effect: As above
  - target: prospector's dugout
    section: 4
    layer: ground
    size: [48, 32]
    sprite: dugout
    hp: 20
    hardened: true
    reveals: prospector's cache
    at: [[122.8, 110]]   # in a crater rim west of the road; passes the screen middle at about 125.2 s
    notes:
      target: "Collapsed prospector's dugout in a crater rim (**hardened**, {hp} HP; t≈125)"
      effect: Only `anti-ground` weapons or the Airstrike open it; releases the hidden crate
  - target: husk nest
    section: 4
    enemy: spine-turret
    count: 4
    at: [[144.05, 92], [144.45, 150], [145.75, 344], [146.15, 400]]   # on the rims of the pod husks at 146.5 s (x 120) and 148.2 s (x 372)
    notes:
      target: 'Turret nest: Spine Turret ×{count} among the pod husks (t≈145)'
      effect: As above

secrets:
  - name: prospector's cache
    crate: 100
    radio: {speaker: Okafor, line: "A prospector's cache. Whoever dug in there would want it used, Lancer."}

pickups:
  - {pickup: overdrive, dropped_by: {wave: 45, unit: first}}      # the Brood Pod of the t=45 group, if killed before it bursts
  - {pickup: armour patch, dropped_by: {wave: 115, unit: last}}   # the last Needler of the t=115 group

radio:  # trigger: t or event; {ally} becomes the crawler's number word; requires: special = only with a special fitted; shout: true = the voice shouts it
  - {t: 0, speaker: Okafor, line: "Five crawlers, four hundred civilians. Get them to the terminal, Lancer."}
  - {t: 11, speaker: Crawler One, portrait: generic-civilian, line: "Crawler One rolling. We're slow and we're loud, Aegis. Please don't leave us."}
  - {t: 22, speaker: Varga, line: "That's an egg sac. It hatches on its own in eight seconds. Kill it before then, and be ready for what comes out.", notes: {trigger: first pod}}
  - {t: 34.5, speaker: Rook, line: "Aegis Two over Shackleton. My family's down there somewhere, Lancer. Bring those crawlers home."}
  - {t: 60, requires: special, speaker: Okafor, line: "Hammer flight is on station. Your call, Lancer.", notes: {trigger: Airstrike fitted}}
  - {event: first-ally-hit, speaker: Convoy, portrait: generic-civilian, shout: true, line: "We're taking fire! Crawler {ally} is hit!", notes: {trigger: First crawler hit}}
  - {event: first-ally-lost, speaker: Crawler One, portrait: generic-civilian, line: "We lost {ally}. Oh God, we lost {ally}.", notes: {trigger: Crawler lost (first)}}
  - {event: first-ally-lost, speaker: Okafor, expression: grim, line: "Keep the rest moving, Lancer.", notes: {trigger: "Crawler lost (first), after the convoy's line"}}
  - {t: 74, speaker: Varga, line: "Walker on the rille rim. The claws are armour. Wait for it to turn, then hit the glowing back.", notes: {trigger: first Scuttler}}
  - {t: 86, speaker: Tranquility Control, portrait: generic-cdf, shout: true, line: "Walkers coming over the crater rims, both sides of the road!"}
  - {t: 128, speaker: Tranquility Control, portrait: generic-cdf, line: "Lander impact, grid four. Dust everywhere. Stay on the convoy."}
  - {t: 176, speaker: Crawler One, portrait: generic-civilian, line: "Terminal in sight! Open those doors!"}
  - {event: level-end, allies: [5, 5], speaker: Okafor, line: "All five. Four hundred people. That's what we're for, Aegis.", notes: {trigger: "Level end, 5 crawlers"}}
  - {event: level-end, allies: [1, 4], speaker: Okafor, line: "We got most of them home. Most.", notes: {trigger: "Level end, 1–4 crawlers"}}
  - {event: mission-failed, speaker: Okafor, expression: grim, line: "The convoy is gone, Lancer. Pull back.", notes: {trigger: Mission failed (the failed screen's line)}}
  - {event: secondary-objective, speaker: Varga, line: "Not one sac hatched on its own. You're learning their rhythm.", notes: {trigger: Secondary met}}

objectives:
  primary: escort
  escort:
    ally: civilian-crawler
    y: [150, 234, 318, 402, 486]   # the column's centres, px below the top edge, Crawler One first
    credits: 30                    # per crawler home, through the credit factor
    enter: {t: 4, interval: 1, speed: 84}   # rolling in from the bottom edge, one per second
    hook: {mode: nearest, enemies: [spine-turret, scuttler]}
    easy: {hp: 90}
    hard: {hp: 45}
  secondary: {escapes: brood-pod, credits: 50}   # "Quick hands": every Brood Pod killed before it bursts on its own

music:
  track: 4            # Act 1 A "Afterburner"
  start_section: 1
  full_section: 3     # the intensity stem from the Rille Crossing, where the first walker comes
  ambience: luna
  end_jingle: mission-complete

difficulty:  # the hard pincer at t=140 is in its wave; the stat blocks' hooks apply
  easy: {enemies: {scuttler: {speed_factor: 0.8}}}   # Scuttlers walk 20% slower

briefing:
  pages:
    - {speaker: Okafor, image: level-04-convoy-road, line: "Lancer, brood pods came down around Tranquility Base overnight. The heritage site is fine. The town around it is not. Four hundred civilians are loading into five crawlers for the run to the mass-driver terminal, and Vrell walkers are already in the craters along the road. You are their escort. Crawlers are slow and they can't dodge: anything on the ground that shoots will shoot at them. Lose all five and this mission is over. High Command has released Hammer flight to us. Use it."}
    - {speaker: Varga, image: level-04-walker-scan, line: "The walkers turn to face where they're going. Their claws stop your rounds, but their backs glow. Be patient."}
  teaser: {speaker: Okafor, line: "Tomorrow you fly over people, Lancer. Bring something that can hit the ground."}

