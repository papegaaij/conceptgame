# Rille: the ground channel's centre is x = 268 + 18 sin(2pi u/960 + 0.6) + 8 sin(4pi u/960 + 2.0),
# u = layer position mod 960; open 30 px either side, walls to 46, rims to ~56. In section 3 the
# road runs 150 px west of it, crosses on the bridge at 104.9-108.4 s and runs east of it to the
# rille's end. Motion budget: the plumes (the atmosphere's banks, drifting) and the sled-run
# overlays (one animated piece id, placed 10 times along the rail) are the only movers.
backdrop:
  # Presentation only. Luna, Mare Tranquillitatis: a top-down surface (no deep layer, Earth only as
  # the earthshine tint in the shadows), the rille floor on far only where the ground opens.
  scroll_factors: {far: 0.85, ground: 1.0, low-air: 1.35, high-air: 2.2}
  ramp: 2
  haze_colour: 5a6274  # grey-blue: shows only over the rille floor
  atmosphere:
    clear: {haze: 0.3}                                # no plumes
    light: {banks: plumes-light, haze: 0.35}          # thin regolith plumes from impacts
    medium: {banks: plumes-medium, haze: 0.4}         # dust kicked up by walkers and landings
    heavy: {banks: plumes-heavy, haze: 0.5}           # the pod lander's impact plume (130-137 s)
  tile_sets:
    # ground: one shared terrain and palette; seams fall on rows where the features fade out
    mare-a: {layer: ground, height: 960}              # grey mare regolith
    mare-b: {layer: ground, height: 960}              # grey mare regolith, second variant
    rille-rims: {layer: ground, height: 960}          # mare-b with the rille's channel (transparent)
    crater-growth: {layer: ground, height: 960}       # crater field with teal Vrell roots
    mass-driver-field: {layer: ground, height: 960}   # cratered mare with the mass-driver rail at x 432
    rille-floor: {layer: far, height: 960}            # the rille floor in earthshine
    plumes-light: {layer: low-air, height: 960, drift: 6}     # ~10 % cover
    plumes-medium: {layer: low-air, height: 960, drift: 8}    # ~22 % cover
    plumes-heavy: {layer: low-air, height: 960, drift: 10}    # ~52 % cover, dense
    ejecta-streaks: {layer: high-air, height: 960}            # ejected rock (additive)
  pieces:
    convoy-apron: {layer: ground, size: [168, 540], mid_size: true}   # the marshalling slab, lamps, cargo
    hab-domes-a: {layer: ground, size: [180, 150], mid_size: true}    # pressure domes, truss, radiator, cargo
    hab-domes-b: {layer: ground, size: [180, 150], mid_size: true}
    heritage-dome: {layer: ground, size: [128, 128], mid_size: true}  # the Eagle's descent stage under glass
    landing-pad: {layer: ground, size: [96, 96]}
    rover-a: {layer: ground, size: [64, 72]}          # abandoned pressurised rover
    rover-b: {layer: ground, size: [72, 72]}          # abandoned utility rover with trailer
    boulder: {layer: ground, size: [64, 56]}
    boulder-growth-a: {layer: ground, size: [72, 64]} # a Vrell socket on top: a Spine Turret's base
    boulder-growth-b: {layer: ground, size: [72, 64]}
    rille-end-south: {layer: ground, size: [200, 160]}   # covers the channel's start at the section 3 seam
    rille-end-north: {layer: ground, size: [200, 160]}   # covers its end at the section 4 seam
    road-bridge: {layer: ground, size: [216, 280], mid_size: true}   # turned to the road (28.8 degrees)
    road-bridge-arches: {layer: ground, size: [216, 280]}            # its overhead arches, the turrets on top
    pod-husk-a: {layer: ground, size: [110, 100], mid_size: true}    # split lander husk in its crater
    pod-husk-b: {layer: ground, size: [110, 100], mid_size: true}
    rail-head: {layer: ground, size: [112, 176], mid_size: true}     # loading station over the rail's start
    sled-run: {layer: ground, size: [48, 480], frames: 30, fps: 10}  # rail lamps + the sled shot (3 s loop)
    terminal-gate: {layer: ground, size: [432, 480], mid_size: true} # the hangar's apron, static landing lights
    terminal-gate-roof: {layer: ground, size: [432, 480]}            # the overhead vehicle hangar, 380x300
  placed:
    # 1. Tranquility Base
    - {piece: convoy-apron, t: 0, x: 240}            # exactly the screen at t = 0: the column on it
    - {piece: landing-pad, t: 2, x: 400}
    - {piece: hab-domes-a, t: 5.5, x: 92}
    - {piece: heritage-dome, t: 9.5, x: 372}
    - {piece: landing-pad, t: 14, x: 96}
    - {piece: hab-domes-b, t: 19, x: 378}
    - {piece: boulder, t: 23, x: 420}
    # 2. Mare Road: rovers, boulders, the two turret nests' bases
    - {piece: rover-a, t: 29, x: 110}
    - {piece: boulder, t: 33, x: 390}
    - {piece: boulder-growth-a, t: 41.8, x: 180}
    - {piece: boulder-growth-b, t: 42.6, x: 346}
    - {piece: boulder-growth-a, t: 43.4, x: 168}
    - {piece: rover-b, t: 50, x: 392}
    - {piece: boulder, t: 56, x: 96}
    - {piece: boulder-growth-b, t: 63.4, x: 300}
    - {piece: boulder-growth-a, t: 64, x: 100}
    - {piece: boulder-growth-b, t: 64.8, x: 330}
    - {piece: boulder-growth-a, t: 65.4, x: 104}
    - {piece: boulder, t: 68, x: 330}
    # 3. Rille Crossing: the rille's ends sit on the seams (layer position 8952 and 13728)
