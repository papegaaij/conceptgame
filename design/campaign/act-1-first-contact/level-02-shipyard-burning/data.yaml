    # 5. Breakout
    - {piece: platform, t: 166, x: 240}
    - {piece: earth-limb, t: 196, x: 240}  # the crest enters at the top at about 172 s; the top edge stays above the screen through the 15 s outro
    - {piece: moon, t: 192, x: 400}        # in the open space above the limb's crest, drawn over the limb

briefing:
  pages:
    - {speaker: Okafor, image: level-02-burning-yards, line: "Lancer, the scouts were the knock on the door. The main Vrell force hit the Gagarin yards overnight. Half the outer ring is burning, and four drydocks still have work crews inside. The Vrell are growing something on the hulls. Burn it off before each dock leaves your sector: every dock you clear is a crew that walks home. Aegis Two has the north arm. You have the south. Aegis Actual out."}
    - {speaker: Varga, image: level-02-yield-signal, line: "About yesterday's transmission. I ran it through every language model we have. One pattern repeats, and the best fit is a single word: *yield*. And Lancer, the growths are turrets. Once you're behind them, they can't track you."}
  teaser: {speaker: Varga, line: "The yards are crawling with growths that shoot back. A wider gun would help."}
